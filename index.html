<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Was injected by doGet's addMetaTag under HtmlService. On a static host it has
     to be here, or the whole mobile layout is wrong. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>GYV · Ambria Cockpit</title>

<!-- GYV · Ambria Cockpit — static build.
     Talks to the backend over fetch() to the Apps Script /exec URL in API_URL
     below. Nothing is hardcoded: tabs, venues and permissions all come from
     bootstrap (User_Master + Role_Permission). -->

<!-- Settings live in ONE small file: the /exec URL and the build stamp.
     Loaded before the app script below, and also imported by the service
     worker, so the build number can never disagree between the two. -->
<script src="config.js"></script>

<!-- Installable app -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5C4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ambria">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<!-- Cache control for the document itself is set by Netlify in _headers. These
     stay as a belt-and-braces for any host that ignores it. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking. media="print" lets the browser fetch this at low priority
     without holding up first paint; onload flips it to all and it applies. Both
     --ui and --display fall back to system-ui, so the second before it lands
     looks ordinary rather than broken. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>

<!-- html2canvas (~200KB) and jsPDF (~360KB) USED TO LOAD HERE: blocking, in the
     head, on every single launch — for two buttons on one tab that most shifts
     never touch. They are now fetched on first export by _libLoad(), below. If
     you ever move them back up here, know that you are paying ~550KB of download
     and parse before first paint to do it. -->

<style>
  :root{
    --bg:#EEF1EF; --surface:#FFFFFF; --ink:#14201C; --muted:#5C6B66;
    --line:#DCE2DE; --line-2:#E9EDEA;
    --accent:#0F5C4A; --accent-ink:#0A3F33; --accent-soft:#E4F0EB;
    --warn:#9A6712; --warn-soft:#FBF1DB; --danger:#A5322F; --danger-soft:#F7E4E3;
    --ok:#0F5C4A;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(20,32,28,.06),0 8px 24px rgba(20,32,28,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ui:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --display:"Space Grotesk","Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ui); background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer}
  input,select{font-family:inherit; font-size:15px}
  a{color:var(--accent)}
  .mono{font-family:var(--mono)}
  .eyebrow{font-family:var(--display); text-transform:uppercase; letter-spacing:.14em;
    font-size:11px; font-weight:600; color:var(--muted)}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .login-card{width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 24px}
  .brand{font-family:var(--display); font-weight:700; letter-spacing:-.01em; font-size:22px}
  .brand .dot{color:var(--accent)}
  .login-sub{color:var(--muted); font-size:13px; margin:2px 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:#fff; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{border:1px solid transparent; border-radius:var(--radius-sm); padding:11px 16px; font-weight:600;
    font-size:14px; background:var(--accent); color:#fff; width:100%}
  .btn:hover{background:var(--accent-ink)}
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:#fff; color:var(--ink); border-color:var(--line); width:auto}
  .btn.secondary:hover{background:var(--line-2)}
  .btn.small{width:auto; padding:8px 12px; font-size:13px}
  .btn.danger{background:var(--danger)} .btn.danger:hover{filter:brightness(.94)}
  .btn:disabled{opacity:.55; cursor:not-allowed}
  .msg{font-size:13px; margin-top:12px; min-height:18px}
  .msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}

  /* ---------- App shell ---------- */
  #app{max-width:920px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
  header.bar{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--line)}
  header.bar .who{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
  .rolechip{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:10px;
    font-weight:600; background:var(--accent-soft); color:var(--accent-ink);
    padding:3px 8px; border-radius:999px}

  /* venue context bar — the signature element */
  .venuebar{display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--surface); border-bottom:1px solid var(--line); position:relative}
  .venuebar::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px;
    background:var(--venue-hue,#0F5C4A)}
  .venuebar .vlabel{flex:1; min-width:0}
  .venuebar .vlabel .k{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em}
  .venuebar .vlabel .v{font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px}
  .venuebar .vcode{font-family:var(--mono); font-size:12px; color:#fff; background:var(--venue-hue,#0F5C4A);
    padding:2px 7px; border-radius:6px}
  .venuebar.all{--venue-hue:#5C6B66}
  .venuebar.all .vlabel .v small{color:var(--warn); font-weight:600}
  .venuebar select{padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff}

  /* tabs */
  nav.tabs{display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background:var(--bg);
    border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch}
  nav.tabs button{white-space:nowrap; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600}
  nav.tabs button.active{background:var(--ink); color:#fff; border-color:var(--ink)}

  main{flex:1; padding:16px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; margin-bottom:16px}
  .card h2{margin:0 0 2px; font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:-.01em}
  .card .sub{color:var(--muted); font-size:13px; margin:0 0 14px}

  .stub{text-align:center; color:var(--muted); padding:36px 16px}
  .stub .big{font-family:var(--display); font-size:16px; color:var(--ink); margin-bottom:4px}

  /* sub-tabs */
  .subtabs{display:flex; gap:6px; margin-bottom:16px}
  .subtabs button{border:1px solid var(--line); background:#fff; color:var(--muted);
    border-radius:var(--radius-sm); padding:7px 14px; font-size:13px; font-weight:600}
  .subtabs button.active{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent)}

  /* users list */
  .ulist{display:flex; flex-direction:column; gap:8px}
  .urow{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line);
    border-radius:var(--radius-sm); background:#fff}
  .urow .uname{font-weight:600}
  .urow .umeta{font-size:12px; color:var(--muted)}
  .urow .spacer{flex:1}
  .tag{font-size:10px; font-weight:600; padding:2px 7px; border-radius:999px; text-transform:uppercase; letter-spacing:.06em}
  .tag.role{background:var(--accent-soft); color:var(--accent-ink)}
  .tag.off{background:var(--danger-soft); color:var(--danger)}
  .tag.nopw{background:var(--warn-soft); color:var(--warn)}

  /* editor form */
  .form-grid{display:grid; grid-template-columns:1fr; gap:14px}
  @media(min-width:560px){ .form-grid{grid-template-columns:1fr 1fr} .form-grid .full{grid-column:1/-1} }
  .checks{display:flex; flex-wrap:wrap; gap:8px}
  .checks label{display:flex; align-items:center; gap:6px; font-size:13px; border:1px solid var(--line);
    padding:7px 11px; border-radius:999px; background:#fff; cursor:pointer}
  .checks input{accent-color:var(--accent)}
  .switch{display:flex; align-items:center; gap:8px; font-size:14px}
  .actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}

  /* roles matrix */
  .matrix-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-sm)}
  table.matrix{border-collapse:collapse; width:100%; font-size:13px; min-width:420px}
  table.matrix th, table.matrix td{border-bottom:1px solid var(--line-2); padding:9px 10px; text-align:center}
  table.matrix thead th{background:var(--bg); position:sticky; top:0; font-family:var(--display);
    text-transform:uppercase; letter-spacing:.06em; font-size:11px; color:var(--muted)}
  table.matrix td.cap, table.matrix th.cap{text-align:left; font-weight:500; color:var(--ink); white-space:nowrap}
  table.matrix .grouprow td{background:var(--accent-soft); color:var(--accent-ink); text-align:left;
    font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:600}
  table.matrix input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent); cursor:pointer}
  table.matrix input:disabled{accent-color:var(--muted); cursor:not-allowed; opacity:.6}
  .locknote{font-size:12px; color:var(--muted); margin-top:10px}

  /* per-user permission checklist (user-based) */
  .permgroup{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px;
    font-weight:600; color:var(--accent-ink); background:var(--accent-soft);
    padding:6px 10px; border-radius:6px; margin:14px 0 6px}
  .permrow2{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 6px; border-bottom:1px solid var(--line-2); cursor:pointer}
  .permrow2 .pcname{font-size:14px}
  .permchk{width:20px; height:20px; accent-color:var(--accent); cursor:pointer; flex:none}

  /* dynamic permissions editor */
  .permsearch{margin-bottom:12px}
  .permgrp{border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:8px; overflow:hidden}
  .permgrphead{display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--bg); cursor:pointer}
  .permchev{color:var(--muted); font-size:11px; transition:transform .15s; display:inline-block}
  .permgrp:not(.collapsed) .permchev{ transform:rotate(90deg) }
  .permgname{font-family:var(--display); font-weight:600; font-size:13px; flex:1}
  .permgcount{font-family:var(--mono); font-size:11px; color:var(--muted)}
  .permgrp.collapsed .permgrpbody{ display:none }
  .permgrpbody{padding:4px 12px 8px}
  .permitem{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line-2)}
  .permitem:last-child{border-bottom:none}
  .permitem .pcname{font-size:13px}
  .swui{position:relative; display:inline-block; width:38px; height:22px; flex:none; cursor:pointer}
  .swui input{opacity:0; width:0; height:0; position:absolute}
  .swtrack{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:background .15s}
  .swtrack::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .swui input:checked + .swtrack{ background:var(--accent) }
  .swui input:checked + .swtrack::after{ transform:translateX(16px) }
  .swui.gall{width:34px; height:20px}
  .swui.gall .swtrack::after{width:16px; height:16px}
  .swui.gall input:checked + .swtrack::after{ transform:translateX(14px) }

  /* purchases entry */
  .pbill{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px}
  .pbill .full{grid-column:1/-1}
  .plabels{display:grid; grid-template-columns:minmax(0,1fr) 58px 84px 74px 24px 20px; gap:5px;
    font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 2px 4px}
  .pline{display:grid; grid-template-columns:minmax(0,1fr) 58px 84px 74px 24px 20px; gap:5px; align-items:center; margin-bottom:6px}
  .pIssueBtn{border:1px solid var(--line); background:#fff; color:var(--accent); border-radius:6px;
    font-size:14px; line-height:1; padding:5px 0; cursor:pointer}
  .pIssueBtn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .pissuesum{grid-column:1/-1; font-size:11px; color:var(--accent-ink); background:var(--accent-soft);
    border-radius:6px; padding:4px 8px; margin:2px 0 4px}
  /* direct-issue popup */
  .modal-ov{position:fixed; inset:0; background:rgba(20,32,28,.45); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:20px}
  .modal-card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px; width:100%; max-width:420px; max-height:85vh; overflow:auto}
  .modal-card h3{margin:0 0 2px; font-family:var(--display); font-size:16px}
  .modal-sub{color:var(--muted); font-size:13px; margin-bottom:14px}
  .dilabels{display:grid; grid-template-columns:minmax(0,1fr) 72px 24px; gap:6px; font-size:10px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 2px 4px}
  .displit{display:grid; grid-template-columns:minmax(0,1fr) 72px 24px; gap:6px; align-items:center; margin-bottom:6px}
  .displit input{width:100%; min-width:0; padding:8px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff}
  .displit input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
  .diDel{border:none; background:transparent; color:var(--danger); font-size:18px; cursor:pointer; padding:0}
  .ditotal{font-size:13px; color:var(--muted); margin:12px 0 4px} .ditotal b{color:var(--ink); font-family:var(--mono)}
  .modal-acts{display:flex; gap:8px; margin-top:14px}
  .pline input{width:100%; min-width:0; padding:8px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff}
  .pline input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
  .pAmt{font-family:var(--mono); font-size:12px; text-align:right; color:var(--ink); white-space:nowrap}
  .pDel{border:none; background:transparent; color:var(--danger); font-size:20px; line-height:1; padding:0; cursor:pointer}
  .phint{grid-column:1/-1; font-family:var(--mono); font-size:11px; color:var(--muted); margin:-2px 0 4px 2px}
  /* Unit of measure for the line's item. Its own full-width grid row, so no entry
     form's column widths change and nothing gets narrower on a phone. Accent
     colour, not muted, because it is a fact about what is being typed rather than
     a background suggestion like the last-rate hint. */
  .uhint{grid-column:1/-1; font-family:var(--mono); font-size:11px; color:var(--accent); margin:-2px 0 4px 2px}
  .ptotal{margin-left:auto; font-size:14px; color:var(--muted)} .ptotal b{color:var(--ink); font-family:var(--mono)}

  /* async save status chips */
  .savechip{display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:var(--radius-sm);
    font-size:13px; margin-bottom:8px; border:1px solid var(--line); background:#fff}
  .savechip .sc-text{flex:1; min-width:0}
  .savechip.saving{color:var(--muted)}
  .savechip.ok{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
  .savechip.error{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
  .sc-spin{border-color:rgba(15,92,74,.25) !important; border-top-color:var(--accent) !important}
  .sc-tick{font-weight:700; color:var(--accent)}
  .sc-x{font-weight:700; color:var(--danger); width:14px; text-align:center}
  .sc-retry{flex:none}

  /* issues entry */
  .ilabels{display:grid; grid-template-columns:minmax(0,1fr) 80px 24px; gap:6px;
    font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 2px 4px}
  .iline{display:grid; grid-template-columns:minmax(0,1fr) 80px 24px; gap:6px; align-items:center; margin-bottom:6px}
  .iline input{width:100%; min-width:0; padding:8px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff}
  .iline input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}

  /* pending / unprocessed list */
  .pendrow{display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line);
    border-left:4px solid var(--warn); border-radius:var(--radius-sm); background:#fff; margin-bottom:8px}
  .pendmain{flex:1; min-width:0}
  .pendtype{font-weight:600; font-size:14px}
  .pendreason{font-size:12px; color:var(--danger); margin-top:2px}
  .pendmeta{font-size:11px; color:var(--muted); margin-top:2px; font-family:var(--mono)}
  .pendacts{display:flex; gap:6px; flex:none}

  /* sales form + import */
  .smoney{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  @media(min-width:560px){ .smoney{grid-template-columns:1fr 1fr 1fr} }
  .slabels{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.85fr) 52px 44px 58px 20px; gap:5px;
    font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:0 2px 4px}
  .sline{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.85fr) 52px 44px 58px 20px; gap:5px; align-items:center; margin-bottom:6px}
  .sline input{width:100%; min-width:0; padding:8px 6px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff}
  .sline input:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
  .sAmt{font-family:var(--mono); font-size:11px; text-align:right; white-space:nowrap; color:var(--ink)}
  .sline .sItem[readonly]{background:var(--bg); color:var(--muted); cursor:default}
  .simport #sFile{display:block; margin:10px 0 4px; font-size:13px}
  .smapgrid{display:grid; grid-template-columns:1fr; gap:6px}
  @media(min-width:560px){ .smapgrid{grid-template-columns:1fr 1fr} }
  .smaprow{display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:6px 10px}
  .smaprow .smaplbl{font-size:13px; font-weight:500}
  .smaprow .sreq{color:var(--danger)}
  .smaprow select{padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; max-width:56%}

  /* stock */
  .stkctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
  .stksearch{flex:1; min-width:160px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:#fff}
  .stksearch:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
  .stklowtog{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap}
  .stklowtog input{accent-color:var(--accent)}
  table.stktbl td{ text-align:right; font-family:var(--mono); font-size:12px; white-space:nowrap }
  table.stktbl td.cap{ text-align:left; font-family:var(--ui); white-space:normal }
  .stkcat{font-size:10px; color:var(--muted); font-family:var(--ui)}
  table.stktbl td.stkclose{ font-weight:700; color:var(--ink) }
  table.stktbl td.stkval{ color:var(--accent-ink) }
  table.stktbl tr.stklow td.cap{ color:var(--danger) }
  .lowtag{font-size:9px; font-weight:700; letter-spacing:.06em; background:var(--danger-soft); color:var(--danger); padding:1px 5px; border-radius:4px; vertical-align:middle}
  .stktot{margin-top:10px; font-size:13px; color:var(--muted)} .stktot b{color:var(--ink); font-family:var(--mono)}

  /* requirement reminder */
  .reqalert{margin:10px 12px 0; padding:10px 12px; background:#FFF8E6;
            border:1px solid var(--warn); border-left-width:4px; border-radius:var(--radius-sm)}
  .reqalert h4{margin:0 0 2px; font-family:var(--display); font-size:11px; font-weight:600;
               text-transform:uppercase; letter-spacing:.07em; color:#8A5A00}
  .reqalert ul{margin:6px 0 8px; padding-left:18px; font-size:13px}
  .reqalert li{margin:2px 0}
  .reqalert .ra-acts{display:flex; gap:8px; flex-wrap:wrap}
  .tabbadge{display:inline-block; min-width:16px; margin-left:6px; padding:0 5px; border-radius:9px;
            background:var(--danger); color:#fff; font-size:10px; font-weight:700; line-height:16px;
            text-align:center; vertical-align:middle}

  /* reports */
  .rptmeta{font-size:12px; color:var(--muted); margin:6px 0}
  table.rptbl td{ font-size:12px; white-space:nowrap; font-family:var(--mono) }
  table.rptbl td:first-child, table.rptbl th:first-child{ text-align:left; font-family:var(--ui); white-space:normal }
  .rpcsvta{width:100%; height:120px; margin:8px 0 12px; font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px}
  .rpsecttitle{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:600;
    color:var(--accent-ink); background:var(--accent-soft); padding:6px 10px; border-radius:6px; margin:14px 0 6px}
  .rptitle{font-size:13px; color:var(--muted); margin:2px 0 10px} .rptitle b{color:var(--ink); font-family:var(--display)}
  /* dynamic report colours */
  table.rptbl tr.rphi td{ background:var(--accent); color:#fff; font-weight:700 }
  table.rptbl tr.rphi td.rpneg{ color:#FFD9D0 }
  table.rptbl tr.rpgrand td{ background:var(--accent-soft); color:var(--accent-ink); font-weight:700 }
  table.rptbl tr.rpsub td{ background:var(--line-2); font-weight:600 }
  table.rptbl tr.rpdiv td{ background:#F4F7F5; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; font-size:10px; font-family:var(--ui) }
  table.rptbl td.rpneg{ color:#C0392B }

  /* ── management pack presentation (also what the PDF captures) ── */
  table.rptbl td:not(:first-child), table.rptbl th:not(:first-child){ text-align:right }
  /* Zebra must NOT touch rows that paint their own background. An unqualified
     nth-child rule scores (0,2,4) against tr.rphi at (0,2,3), so it wins and
     repaints a dark-green highlight row near-white while its text stays white —
     the row goes invisible. Excluding those classes fixes it without !important. */
  table.rptbl tbody tr:nth-child(even):not(.rphi):not(.rphired):not(.rpgrand):not(.rpsub):not(.rpdiv):not(.rpwarn) td{ background:#FAFBFA }
  table.rptbl tr.rphi td, table.rptbl tr.rphired td{ font-size:13px; letter-spacing:.01em }
  /* Green when the figure is positive, red when it is negative. Applied to the
     Annx-2 / Annx-3 banner rows and to the two margin rows under them, so the
     sign reads at a glance instead of being parsed off a minus sign. rphired is
     rphi in red - keep the two rules in step. Both are in the zebra-stripe
     exclusion above: nth-child(even) would repaint the banner near-white while
     the text stayed white, and the row would go invisible. */
  table.rptbl tr.rphired td{ background:#B03A2E; color:#fff; font-weight:700 }
  table.rptbl tr.rphired td.rpneg{ color:#FFE3DE }
  table.rptbl tr.rpposrow td{ color:#0F5C4A; font-weight:700 }
  table.rptbl tr.rpnegrow td{ color:#C0392B; font-weight:700 }
  table.rptbl tr.rpstock td{ color:var(--muted); font-style:italic }
  table.rptbl tr.rpstock td:first-child{ padding-left:22px }
  table.rptbl tr.rpwarn td{ background:#FFF6E5; color:#8A5A00; font-weight:600;
    text-align:left; white-space:normal; font-family:var(--ui); font-size:11px }
  table.rptbl tr.rphi td:first-child, table.rptbl tr.rphired td:first-child, table.rptbl tr.rpgrand td:first-child{ font-weight:700 }
  .rpsecttitle{ margin-top:20px }
  .rpsect:first-child .rpsecttitle{ margin-top:4px }
  .rpsect{ break-inside:avoid; page-break-inside:avoid }
  .matrix-wrap{ background:var(--surface) }

  /* toast */
  #toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:#fff; padding:11px 16px; border-radius:999px; font-size:13px; font-weight:500;
    box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:50; max-width:90vw}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--danger)}

  .spin{display:inline-block; width:15px; height:15px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
.acbox{position:absolute; z-index:200; touch-action:pan-y; background:#fff; border:1px solid var(--line);
    border-radius:var(--radius-sm); box-shadow:var(--shadow); max-height:250px; overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  .acitem{padding:11px 12px; font-size:14px; border-bottom:1px solid var(--line-2)}
  .acitem:last-child{border-bottom:none}
  .acitem.on{background:var(--accent-soft)}
  /* Two-part row: the name, and the unit it is counted in. The unit is presentation
     only — the value committed to the field comes from data-v, never from the row
     text — so it can never end up inside an item name. */
  .acitem{display:flex; align-items:baseline; gap:8px}
  .acitem .acnm{flex:1; min-width:0}
  .acitem .acuom{flex:none; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); background:var(--accent-soft); border-radius:4px; padding:2px 6px}
  /* Rejected free-text item. The field is cleared, so without a visible flash the
     value just vanishes and looks like the app ate the typing. */
  @keyframes acbad{0%,100%{background:#fff}35%{background:#FFE0E0}}
  input.acbad{animation:acbad .5s ease-out 2; border-color:var(--bad,#A5322F)}
  #updbar{position:fixed; left:0; right:0; top:0; z-index:60; display:flex; align-items:center; justify-content:center; gap:12px;
    background:var(--accent); color:#fff; padding:8px 12px; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #updbar button{background:#fff; color:var(--accent-ink); border:none; border-radius:6px; padding:5px 12px; font-weight:600; cursor:pointer}
</style>

</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-card">
    <div class="brand">GYV <span class="dot">·</span> Ambria</div>
    <div class="login-sub">Daily costing &amp; inventory cockpit</div>
    <div class="field">
      <label for="u">Username</label>
      <input id="u" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">Sign in</button>
    <div class="msg err" id="loginMsg"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <header class="bar">
    <div class="brand" style="font-size:18px">GYV <span class="dot">·</span> Ambria</div>
    <div class="who">
      <span id="whoName"></span>
      <span class="rolechip" id="whoRole"></span>
      <button class="btn secondary small" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <div class="venuebar" id="venuebar">
    <div class="vlabel">
      <div class="k">Operating in</div>
      <div class="v" id="venueName"></div>
    </div>
    <div id="venueSwitchWrap" class="hidden">
      <select id="venueSwitch" aria-label="Switch venue"></select>
    </div>
  </div>

  <div id="reqAlertSlot"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>

<div id="toast"></div>

<script>
/* ---------------- build stamp ----------------
   Comes from config.js, which the service worker also imports — so the page and
   the cache can never disagree about which build is running. */
var APP_BUILD=(typeof self!=='undefined' && self.GYV_BUILD) || 'dev';
var APP_VERSION=APP_BUILD;

/* ---------------- transport: static host -> Apps Script /exec --------------
   Two rules make cross-origin fetch to Apps Script work, and both matter:

   1. NO custom headers, and DO NOT set Content-Type. Apps Script never answers a
      CORS preflight, so the request has to stay a "simple" request. Passing a
      plain string body makes the browser send text/plain, which is safelisted, so
      no OPTIONS is ever sent. Adding 'Content-Type: application/json' would
      trigger a preflight and every single call would fail.
   2. redirect:'follow' (the default). /exec replies 302 to googleusercontent.com
      and the CORS header lives on that second response, not the first.

   There is NO app secret in this file. A static page cannot keep one, so the
   server requires a session token for everything except login, and login is
   authenticated by username and password like any other login. If you find
   yourself about to paste WEBAPP_SECRET in here, stop: that would hand every
   visitor unauthenticated write access. */
var API_URL=(typeof self!=='undefined' && self.GYV_API_URL) || '';
/* processIssues is measured at 31-88s (diagSlowCalls), so this ceiling cannot be
   short. Apps Script's own limit is 6 minutes, so 180s sits well inside it.
   An aborted fetch does NOT stop the server: the write very probably completes.
   So a timeout carries timedOut=true and is treated exactly like queuedStill —
   reported, never copied to Pending. Re-entering a voucher because a screen
   looked stuck is how the same bill gets written twice. */
var API_CALL_TIMEOUT_MS=180000;
function call(payload){
  return new Promise(function(resolve,reject){
    if(!API_URL || API_URL.indexOf('PASTE_')===0){
      reject(new Error('Not configured yet. Open config.js and replace '+
        'PASTE_YOUR_EXEC_URL_HERE with your Apps Script /exec URL.'));
      return;
    }
    var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
    var settled=false;
    var timer=setTimeout(function(){
      if(settled) return; settled=true;
      try{ if(ctl) ctl.abort(); }catch(e){}
      var te=new Error('The server has not answered in '+Math.round(API_CALL_TIMEOUT_MS/1000)+
        's. It is most likely still finishing \u2014 do NOT re-enter this. Check the '+
        'tab in a minute, and only use Pending if it never appears.');
      te.timedOut=true;
      reject(te);
    }, API_CALL_TIMEOUT_MS);
    var opt={ method:'POST', body:JSON.stringify(payload), redirect:'follow' };
    if(ctl) opt.signal=ctl.signal;
    fetch(API_URL, opt).then(function(r){
      if(!r.ok) throw new Error('Server returned HTTP '+r.status);
      return r.text();
    }).then(function(txt){
      if(settled) return; settled=true; clearTimeout(timer);
      var out=null;
      try{ out=JSON.parse(txt); }
      catch(e){
        /* Not JSON almost always means Google's own sign-in page came back,
           which means the deployment is not readable by "Anyone". */
        reject(new Error('The server did not return JSON. Check the Web App '+
          'deployment is Execute as: Me and Who has access: Anyone.'));
        return;
      }
      resolve(out||{ok:false,error:'Empty response'});
    }).catch(function(e){
      if(settled) return; settled=true; clearTimeout(timer);
      reject((e && e.name==='AbortError') ? new Error('Request cancelled.') : e);
    });
  });
}
/* Writes are recorded in Submission_Queue before they run, so the server answers
   one of two ways:
     - the caller also drained the queue, so the real result comes straight back
     - someone else was mid-write, so a ticket comes back and we poll for it
   Either way nothing is lost and no "busy" message ever reaches the person.

   `busy` is kept as a safety net: it can now only mean the submission could not
   even be recorded, which guarantees nothing was written, so a retry is safe. */
var API_BUSY_WAITS=[800, 2000, 4000];
var API_POLL_WAITS=[500, 900, 1500, 2500, 4000, 6000, 8000];
function api(action, data){
  var p={action:action, data:data||{}};
  if(state.session) p.session=state.session;
  var attempt=0;
  function go(){
    return call(p).then(function(res){
      if(res && res.queued && res.ticket) return qPoll(res.ticket);
      if(res && res.busy && attempt < API_BUSY_WAITS.length){
        var w=API_BUSY_WAITS[attempt++];
        return new Promise(function(r){ setTimeout(r, w); }).then(go);
      }
      return res;
    });
  }
  return go();
}
/* Poll a ticket until its row has been written. Each poll also nudges the queue,
   so a row nobody else picked up gets executed by this very call. */
function qPoll(ticket){
  var i=0;
  function step(){
    var w=API_POLL_WAITS[Math.min(i, API_POLL_WAITS.length-1)];
    i++;
    return new Promise(function(r){ setTimeout(r, w); }).then(function(){
      return call({action:'queueStatus', data:{ticket:ticket}, session:state.session});
    }).then(function(res){
      if(res && res.done) return res;
      if(i >= API_POLL_WAITS.length){
        /* Still unwritten. `queuedStill` tells callers NOT to fall back to the
           Pending queue: the submission is already recorded once, and queueing
           it again would post the same bill twice. */
        return { ok:false, queuedStill:true, ticket:ticket,
                 error:'Recorded as '+ticket+' and still being written. It will finish '+
                       'on its own \u2014 do not re-enter it.' };
      }
      return step();
    }).catch(function(){
      return { ok:false, queuedStill:true, ticket:ticket,
               error:'Recorded as '+ticket+'. Lost contact while it was being written '+
                     '\u2014 check the tab before re-entering.' };
    });
  }
  return step();
}

/* ---------------- state ---------------- */
var state={ session:null, me:null };  // me = bootstrap result
var LS_KEY='gyv_cockpit_session';
function saveSession(t){ try{ localStorage.setItem(LS_KEY, t||''); }catch(e){} }
function loadSession(){ try{ return localStorage.getItem(LS_KEY)||''; }catch(e){ return ''; } }

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function $(id){ return document.getElementById(id); }
function toast(msg, isErr){
  var t=$('toast'); t.textContent=msg; t.className='show'+(isErr?' err':'');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className=''; }, 2600);
}
function hue(code){ // deterministic venue tint
  var s=String(code||''); var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))%360; }
  return 'hsl('+h+',42%,32%)';
}

/* ---------------- tab model (gated by capability) ---------------- */
var TAB_DEFS=[
  {id:'orders',    label:'Orders',    cap:'View: Purchase Orders'},
  {id:'receiving', label:'Receiving', cap:'Entry: Goods Receipt'},
  {id:'purchases', label:'Purchases', cap:'Entry: Purchase'},
  {id:'requirements', label:'Requirements', cap:'View: Requirements'},
  {id:'issues',    label:'Issue',    cap:'Entry: Issue'},
  {id:'returns',   label:'Returns',   cap:'Entry: Return'},
  {id:'sales',     label:'Sales',     cap:'Entry: Sales'},
  {id:'spoilage',  label:'Spoilage',  cap:'Entry: Spoilage'},
  {id:'transfer',  label:'Transfer',  cap:'Action: Inter-Venue Transfer'},
  {id:'stock',     label:'Stock',     cap:'View: Stock / Closing'},
  {id:'bills',     label:'Bills',     bills:true},
  {id:'reports',   label:'Reports',   reports:true},
  {id:'pending',   label:'Pending',   pending:true},
  {id:'control',   label:'Control',   admin:true}   // owner-only control master
];
function canSee(def){
  if(def.admin) return !!(state.me.isOwner || (state.me.caps||{})['Admin: Manage Users'] || (state.me.caps||{})['Admin: Manage Roles']);
  if(def.pending){ return !!(state.me.caps||{})['View: Pending']; }
  if(def.bills){ var bc=state.me.caps||{}; return !!(bc['Action: Upload Attachment'] || bc['Action: Verify Bill'] || bc['Report: Bill Verification']); }
  if(def.reports){ var rc=state.me.caps||{}; return Object.keys(rc).some(function(k){ return k.indexOf('Report:')===0 && rc[k]; }); }
  if(!def.cap) return true;
  return !!(state.me.caps||{})[def.cap];
}
var activeTab=null;

/* ---------------- auth flow ---------------- */
function doLogin(){
  var u=$('u').value.trim(), p=$('p').value;
  var msg=$('loginMsg'); msg.className='msg err'; msg.textContent='';
  if(!u||!p){ msg.textContent='Enter username and password.'; return; }
  var btn=$('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  call({action:'login', data:{username:u, password:p}})
    .then(function(res){
      if(!res.ok){ throw new Error(res.error||'Login failed'); }
      state.session=res.token; saveSession(res.token);
      return bootstrap();
    })
    .catch(function(e){ msg.textContent=(e&&e.message)||'Login failed'; })
    .then(function(){ btn.disabled=false; btn.textContent='Sign in'; });
}
function bootstrap(){
  return api('bootstrap').then(function(res){
    if(!res.ok){
      /* The one distinction that matters at boot: did the SERVER refuse this
         session, or did the request simply never get an answer? Only the first
         should ever throw the stored token away. */
      var be=new Error(res.error||'Bootstrap failed');
      if(/session|log in again/i.test(String(res.error||''))) be.authFail=true;
      throw be;
    }
    state.me=res;
    if(res.venueNames){ for(var k in res.venueNames){ _venueNames[k]=res.venueNames[k]; } }
    renderApp();
  });
}
/* Drafts are keyed per user AND per venue, so nobody ever sees someone else's.
   They are still cleared on logout: on a shared terminal, half-typed vendor
   names and amounts should not sit in localStorage after the shift ends. */
function draftClearAllForUser(){
  try{
    var u=(state.me&&state.me.username)||'';
    if(!u) return;
    var kill=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('gyvDraft:')===0 && k.indexOf(':'+u+':')>=0) kill.push(k);
    }
    kill.forEach(function(k){ localStorage.removeItem(k); });
  }catch(e){}
}
function doLogout(){
  draftClearAllForUser();
  reqAlertStop();
  api('logout').catch(function(){}).then(function(){
    state.session=null; state.me=null; saveSession(''); _usersCache=null;
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    $('u').value=''; $('p').value=''; $('loginMsg').textContent='';
  });
}

/* ---------------- render: shell ---------------- */
function renderApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  /* Show which build the DEPLOYED backend is running. If this does not match
     what diagBuild() prints in the editor, the deployment is stale and no
     amount of reloading will help. */
  $('whoName').textContent=state.me.username;
  $('whoRole').textContent=state.me.role;
  renderVenueBar();
  renderTabs();
  reqAlertStart();
}
function renderVenueBar(){
  var bar=$('venuebar'), v=state.me.venue;
  var isAll=(v==='ALL');
  bar.className='venuebar'+(isAll?' all':'');
  bar.style.setProperty('--venue-hue', isAll?'#5C6B66':hue(v));
  var nameEl=$('venueName');
  if(isAll){
    nameEl.innerHTML='All venues <small>· entry disabled — pick one venue to enter data</small>';
  }else{
    var disp=venueDisplay(v);
    nameEl.innerHTML=esc(disp)+' <span class="vcode">'+esc(v)+'</span>';
  }
  // switcher: only if the role may select venue
  var canSwitch=!!(state.me.caps||{})['Admin: Select Venue'];
  var wrap=$('venueSwitchWrap'), sel=$('venueSwitch');
  if(canSwitch){
    wrap.classList.remove('hidden');
    var opts=(state.me.venues||[]).map(function(c){
      return '<option value="'+esc(c)+'"'+(c===v?' selected':'')+'>'+esc(venueDisplay(c))+'</option>';
    });
    opts.push('<option value="ALL"'+(isAll?' selected':'')+'>All venues</option>');
    sel.innerHTML=opts.join('');
    sel.onchange=function(){ switchVenue(sel.value); };
  }else{
    wrap.classList.add('hidden');
  }
}
var _venueNames={};
function venueDisplay(code){ return _venueNames[code]||code; }
function switchVenue(target){
  api('setVenue', {venue:target}).then(function(res){
    if(!res.ok){ toast(res.error||'Could not switch venue', true); renderVenueBar(); return; }
    state.me.venue=res.venue; renderVenueBar(); renderTabs();
    toast('Now operating in '+(res.venue==='ALL'?'all venues':venueDisplay(res.venue)));
  }).catch(function(e){ toast((e&&e.message)||'Switch failed', true); });
}
function renderTabs(){
  var nav=$('tabs'); nav.innerHTML='';
  var visible=TAB_DEFS.filter(canSee);
  if(!visible.length){ nav.innerHTML='<span class="stub" style="padding:8px">No sections available for your role.</span>'; $('main').innerHTML=''; return; }
  if(!activeTab || !visible.some(function(d){return d.id===activeTab;})) activeTab=visible[0].id;
  visible.forEach(function(d){
    var b=document.createElement('button');
    b.textContent=d.label; b.className=(d.id===activeTab?'active':'');
    b.setAttribute('data-tab', d.id);
    b.onclick=function(){ activeTab=d.id; renderTabs(); };
    nav.appendChild(b);
  });
  paintReqBadge();
  renderMain();
}
function renderMain(){
  acCloseAll();          /* no suggestion box may survive a screen change */
  var m=$('main'); var def=TAB_DEFS.filter(function(d){return d.id===activeTab;})[0];
  if(!def){ m.innerHTML=''; return; }
  /* Drop a pending GRN/REQ hand-off the moment the user leaves its target tab.
     Otherwise the id survives and the next unrelated submission would stamp
     the wrong GRN as converted, or credit the wrong requirement. */
  if(def.id!=='purchases' && _convertGrnId){ _convertGrnId=null; }
  if(def.id!=='issues' && _issueReqId){ _issueReqId=null; }
  if(def.id==='control'){ renderControl(m); return; }
  if(def.id==='purchases'){ renderPurchases(m); return; }
  if(def.id==='issues'){ renderIssues(m); return; }
  if(def.id==='pending'){ renderPending(m); return; }
  if(def.id==='sales'){ renderSales(m); return; }
  if(def.id==='stock'){ renderStock(m); return; }
  if(def.id==='reports'){ renderReports(m); return; }
  if(def.id==='orders'){ renderOrders(m); return; }
  if(def.id==='receiving'){ renderReceiving(m); return; }
  if(def.id==='requirements'){ renderRequirements(m); return; }
  if(def.id==='bills'){ renderBills(m); return; }
  if(def.id==='returns'){ renderReturns(m); return; }
  m.innerHTML='<div class="card"><div class="stub">'+
    '<div class="big">'+esc(def.label)+'</div>'+
    '<div>This section will be wired up next.</div></div></div>';
}

/* ---------------- Control tab (Users + per-user permissions) ---------------- */
function renderControl(m){
  m.innerHTML=''+
    '<div class="card">'+
      '<h2>Control Master</h2>'+
      '<p class="sub">Manage who can sign in, their venues, and exactly what each user is allowed to do.</p>'+
      '<div id="controlBody"></div>'+
    '</div>';
  loadUsers();
}

/* --- Users --- */
var _roles=[], _venues=[], _usersCache=null;
function loadUsers(force){
  var body=$('controlBody');
  if(_usersCache && !force){
    _roles=_usersCache.roles||[]; _venues=_usersCache.venues||[];
    renderUsers(_usersCache.users||[]);
    return;
  }
  body.innerHTML='<div class="stub">Loading users…</div>';
  api('listUsers').then(function(res){

    renderPermsEditor(res);

/* tab label -> capabilities that tab actually needs at runtime.

   EVERY string here must match column A of Role_Permission EXACTLY. A name that
   does not exist there is not an error and not a warning — permGroupsByTab simply
   never claims it, so the capability quietly drops out of its tab group and the
   real one it was meant to be lands under the "(other)" heading instead. The
   visible symptom is the worst kind: you switch the whole group on, the group
   counter says 2/2, and the tab still does not appear for that user, because the
   one capability TAB_DEFS actually gates on was never in the group.

   Two names were wrong for exactly this reason: 'Entry: Sale' (the real one is
   plural, 'Entry: Sales') and 'Entry: Transfer' (the real one is
   'Action: Inter-Venue Transfer'). Those were the Sales and Transfer tabs.

   Amend is deliberately NOT listed. There is no 'Action: Amend Purchase'
   capability — AUTH_ACTION_CAP maps amendPurchases / amendIssues / amendReturns
   onto 'Entry: Purchase' / 'Entry: Issue' / 'Entry: Return', so whoever may enter
   may also amend. Listing a capability that grants nothing would imply a control
   that does not exist. */
var PERM_TAB_CAPS=[
  ['Purchases',   ['Entry: Purchase','View: Purchases',
                   'Entry: Fixed Expense','Report: Fixed Expenses','Action: Upload Attachment']],
  ['Orders',      ['View: Purchase Orders','Entry: Purchase Order','Action: Send PO',
                   'Report: Purchase Order Status']],
  ['Receiving',   ['Entry: Goods Receipt','View: Purchase Orders',
                   'Action: Convert GRN to Purchase','Entry: Purchase']],
  ['Issue',       ['Entry: Issue','View: Issues']],
  ['Requirements',['View: Requirements','Entry: Requirement',
                   'Action: Issue vs Requirement','Report: Requirement Status','Entry: Issue']],
  ['Returns',     ['Entry: Return','View: Returns']],
  ['Sales',       ['Entry: Sales','View: Sales','Report: Sales List']],
  ['Spoilage',    ['Entry: Spoilage','View: Spoilage','Report: Spoilage List']],
  ['Transfer',    ['Action: Inter-Venue Transfer','Report: Transfer Movement']],
  ['Stock',       ['View: Stock / Closing','View: FIFO Layers','Report: Live Stock',
                   'Report: Stock Movement','Report: Stock Item Analysis',
                   'Report: Closing Stock Valuation','Report: Reorder']],
  ['Bills',       ['Action: Upload Attachment','Action: Verify Bill','Report: Bill Verification']],
  ['Pending',     ['View: Pending']],
  ['Control',     ['Admin: Manage Users','Admin: Manage Roles']]
];
function permGroupsByTab(rows, fallbackGroups){
  var byCap={};
  rows.forEach(function(r){ byCap[r.capability]=r; });
  var out=[], claimed={};
  PERM_TAB_CAPS.forEach(function(pair){
    var hits=[];
    pair[1].forEach(function(c){ if(byCap[c]){ hits.push(byCap[c]); claimed[c]=true; } });
    if(hits.length) out.push({name:pair[0], rows:hits});
  });
  if(!out.length) return [];
  (fallbackGroups||[]).forEach(function(g){
    var left=g.rows.filter(function(r){ return !claimed[r.capability]; });
    if(left.length) out.push({name:g.name+' (other)', rows:left});
  });
  return out;
}
/* One capability can now appear under two tabs, i.e. two checkboxes bound to the
   same setting. Without this, toggling one would leave the other showing the old
   state and the group counts disagreeing with the server. */
function peSyncCap(ed, cap, allow){
  Array.prototype.forEach.call(ed.querySelectorAll('.permtog'), function(t){
    if(t.getAttribute('data-cap')===cap) t.checked=allow;
  });
}
function renderPermsEditor(res){
  var ed=$('userEditor');
  if(res.isOwnerUser){
    ed.innerHTML='<div class="card" style="margin-top:16px; border-color:var(--accent)">'+
      '<h2>Permissions · '+esc(res.username)+'</h2>'+
      '<p class="sub">This is an Owner account — it always keeps every capability and can\u2019t be limited.</p>'+
      '<div class="actions"><button class="btn secondary small" id="peClose">Close</button></div></div>';
    $('peClose').onclick=function(){ ed.innerHTML=''; };
    return;
  }
  var groups=[], gmap={};
  (res.rows||[]).forEach(function(r){
    var g=r.group||'Other';
    if(!(g in gmap)){ gmap[g]={name:g, rows:[]}; groups.push(gmap[g]); }
    gmap[g].rows.push(r);
  });
  /* Regroup by TAB. The flat View/Entry/Action listing never answered the only
     question that matters when setting someone up: "what do I switch on so this
     person can do their job?" A tab needs several capabilities spread across
     those groups, and one capability can serve two tabs (View: Purchase Orders
     feeds both Orders and Receiving), so tabs deliberately overlap. Anything no
     tab claims falls through under its original group heading, so a newly added
     capability can never become invisible and un-grantable. */
  var byTab=permGroupsByTab(res.rows||[], groups);
  if(byTab.length) groups=byTab;
  var html='<div class="card" style="margin-top:16px; border-color:var(--accent)">'+
    '<h2>Permissions · '+esc(res.username)+'</h2>'+
    '<p class="sub">Grouped by the tab each capability unlocks, so you can switch on a whole '+
      'job at once. A capability shared by two tabs shows under both \u2014 it is one single '+
      'setting either way. Saved instantly.</p>'+
    '<input class="stksearch permsearch" id="peSearch" placeholder="Filter capabilities…">';
  groups.forEach(function(g,gi){
    var total=g.rows.length, on=g.rows.filter(function(r){ return r.allow; }).length;
    html+='<div class="permgrp" data-grp="'+gi+'">'+
      '<div class="permgrphead">'+
        '<span class="permchev">\u25b8</span>'+
        '<span class="permgname">'+esc(g.name)+'</span>'+
        '<span class="permgcount">'+on+'/'+total+'</span>'+
        '<label class="swui gall" title="Allow all / clear all"><input type="checkbox" data-grp="'+gi+'"'+((on===total&&total>0)?' checked':'')+'><span class="swtrack"></span></label>'+
      '</div><div class="permgrpbody">';
    g.rows.forEach(function(r){
      html+='<div class="permitem" data-cap="'+esc(r.capability)+'">'+
        '<span class="pcname">'+esc(r.capability)+'</span>'+
        '<label class="swui"><input type="checkbox" class="permtog" data-cap="'+esc(r.capability)+'"'+(r.allow?' checked':'')+'><span class="swtrack"></span></label>'+
      '</div>';
    });
    html+='</div></div>';
  });
  html+='<div class="actions" style="margin-top:14px"><button class="btn secondary small" id="peClose">Close</button></div></div>';
  ed.innerHTML=html;
  $('peClose').onclick=function(){ ed.innerHTML=''; };
  Array.prototype.forEach.call(ed.querySelectorAll('.permgrphead'), function(h){
    h.onclick=function(e){ if(e.target.closest('.swui')) return; h.parentNode.classList.toggle('collapsed'); };
  });
  $('peSearch').oninput=function(){
    var q=$('peSearch').value.trim().toLowerCase();
    Array.prototype.forEach.call(ed.querySelectorAll('.permgrp'), function(gp){
      var any=false;
      Array.prototype.forEach.call(gp.querySelectorAll('.permitem'), function(it){
        var match=!q || it.getAttribute('data-cap').toLowerCase().indexOf(q)>=0;
        it.style.display=match?'':'none'; if(match) any=true;
      });
      gp.style.display=any?'':'none';
      if(q) gp.classList.remove('collapsed');
    });
  };
  Array.prototype.forEach.call(ed.querySelectorAll('.permtog'), function(cb){
    cb.onchange=function(){
      var cap=cb.getAttribute('data-cap'), allow=cb.checked;
      cb.disabled=true;
      api('saveUserPermission', {username:res.username, capability:cap, allow:allow})
        .then(function(r){
          if(!r.ok){ cb.checked=!allow; toast(r.error||'Could not save', true); }
          else { peSyncCap(ed, cap, allow); toast(cap+' \u2192 '+(allow?'on':'off')); }
          pePaintGroupCounts(ed);
        })
        .catch(function(e){ cb.checked=!allow; toast((e&&e.message)||'Save failed', true); })
        .then(function(){ cb.disabled=false; });
    };
  });
  Array.prototype.forEach.call(ed.querySelectorAll('.gall input'), function(gc){
    gc.onchange=function(){
      var gi=gc.getAttribute('data-grp'), allow=gc.checked;
      var gp=ed.querySelector('.permgrp[data-grp="'+gi+'"]');
      var toggles=gp.querySelectorAll('.permtog');
      var changes=[]; Array.prototype.forEach.call(toggles, function(t){ changes.push({capability:t.getAttribute('data-cap'), allow:allow}); });
      gc.disabled=true;
      api('saveUserPermissionsBatch', {username:res.username, changes:changes})
        .then(function(r){
          if(!r.ok){ gc.checked=!allow; toast(r.error||'Could not save', true); }
          else {
            Array.prototype.forEach.call(toggles, function(t){
              peSyncCap(ed, t.getAttribute('data-cap'), allow);
            });
            toast('Group '+(allow?'enabled':'cleared'));
          }
          pePaintGroupCounts(ed);
        })
        .catch(function(e){ gc.checked=!allow; toast((e&&e.message)||'Save failed', true); })
        .then(function(){ gc.disabled=false; });
    };
  });
}
function pePaintGroupCounts(ed){
  Array.prototype.forEach.call(ed.querySelectorAll('.permgrp'), function(gp){
    var togs=gp.querySelectorAll('.permtog'), on=0;
    Array.prototype.forEach.call(togs, function(t){ if(t.checked) on++; });
    var cnt=gp.querySelector('.permgcount'); if(cnt) cnt.textContent=on+'/'+togs.length;
    var gall=gp.querySelector('.gall input'); if(gall) gall.checked=(togs.length>0 && on===togs.length);
  });
}

var _itemsCache=null;   // { items:[{name,category,uom}], vendors:[...] }
/* name -> uom, built once per item cache. Rebuilt lazily rather than eagerly so a
   cache refresh only costs anything if a list is actually opened afterwards.
   MUST be nulled wherever _itemsCache is replaced, or a newly added item shows a
   stale unit. */
var _uomIdx=null;
function acUomOf(name){
  if(!_uomIdx){
    _uomIdx={};
    (_itemsCache && _itemsCache.items || []).forEach(function(x){
      _uomIdx[String(x.name).replace(/\s+/g,' ').trim().toLowerCase()]=String(x.uom||'').trim();
    });
  }
  return _uomIdx[String(name).replace(/\s+/g,' ').trim().toLowerCase()]||'';
}
function ensureItems(cb){

    _itemsCache = (res&&res.ok) ? {items:res.items||[], vendors:res.vendors||[], departments:res.departments||[]} : {items:[], vendors:[], departments:[]};
    _uomIdx=null;
    cb();
  }).catch(function(){ _itemsCache={items:[], vendors:[]}; _uomIdx=null; cb(); });
}

function fixRestore(d){
  if(!d) return;
  if(d.date) $('fDate').value=d.date;
  if(d.vendor) $('fVendor').value=d.vendor;
  if(d.bill) $('fBill').value=d.bill;
  if(d.notes) $('fNotes').value=d.notes;
  $('fLines').innerHTML='';
  (d.rows||[]).forEach(function(r){
    addFixedLine();
    var ws=document.querySelectorAll('#fLines .fline');
    var w=ws[ws.length-1];
    w.querySelector('.fHead').value=r[0]||'';
    w.querySelector('.fAmt').value=r[1]||'';
    if(r[2]) w.querySelector('.fType').value=r[2];
  });
  if(!(d.rows||[]).length) addFixedLine();
  recalcFixedTotal();
  toast('Draft restored');
}
function addFixedLine(){
  _fLineSeq++;
  var wrap=document.createElement('div');
  wrap.className='fline';
  wrap.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:6px';
  wrap.innerHTML=''+
    '<input class="fHead" placeholder="Expense head" style="flex:3;min-width:0">'+
    '<input class="fAmt" type="text" inputmode="decimal" placeholder="Amount" style="flex:1.2;min-width:0">'+
    '<select class="fType" style="flex:1.1;min-width:0"><option value="IDE">IDE</option><option value="DE">DE</option></select>'+
    '<button class="pDel fDel" type="button" title="Remove line">\u00d7</button>';
  $('fLines').appendChild(wrap);
  wrap.querySelector('.fAmt').oninput=recalcFixedTotal;
  wrap.querySelector('.fDel').onclick=function(){ wrap.parentNode.removeChild(wrap); recalcFixedTotal(); };
  revealRow(wrap, wrap.querySelector('.fHead'));
}
function recalcFixedTotal(){
  var t=0;
  Array.prototype.forEach.call(document.querySelectorAll('#fLines .fline'), function(w){
    t+=parseFloat(w.querySelector('.fAmt').value)||0;
  });
  var el=$('fTotal'); if(el) el.textContent='\u20b9'+t.toFixed(2);
}
function submitFixedExpense(){
  var msg=$('fMsg'); msg.className='msg err'; msg.textContent='';
  var date=$('fDate').value, vendor=$('fVendor').value.trim(),
      bill=$('fBill').value.trim(), notes=$('fNotes').value.trim();
  if(!date){ msg.textContent='Pick a date.'; return; }
  var rows=[], bad=false;
  Array.prototype.forEach.call(document.querySelectorAll('#fLines .fline'), function(w){
    var head=w.querySelector('.fHead').value.trim();
    var amt=w.querySelector('.fAmt').value;
    var type=w.querySelector('.fType').value;
    if(!head && amt===''){ return; }
    if(!head || amt===''){ bad=true; return; }
    rows.push([date, head, amt, type, vendor, bill, notes]);
  });
  if(bad){ msg.textContent='Each line needs a head and an amount (or clear the line).'; return; }
  if(!rows.length){ msg.textContent='Add at least one expense.'; return; }
  var _fe2=$('fFile');
  var attFile=(_fe2 && _fe2.files && _fe2.files[0]) ? _fe2.files[0] : null;
  if(attFile && attFile.size > 5*1024*1024){
    msg.textContent='That attachment is '+(attFile.size/1048576).toFixed(1)+' MB \u2014 the limit is 5 MB.';
    return;
  }
  var label=rows.length+' expense'+(rows.length===1?'':'s')+(bill?(' \u00b7 '+bill):'');
  var chip=optChip('pStatus', label);
  draftClear('fix');
  buildFixedForm();

  api('processFixedExpenses', {rows:rows}).then(function(res){
    if(!res.ok){
      optFail(chip, 'Not saved: '+(res.error||'failed'));
      toast(res.error||'Not saved', true);
      return;
    }
    /* The server rejects an identical date+head+amount rather than silently
       double-counting a cost, so a partial save is a normal outcome. */
    if(res.errors && res.errors.length){
      optFail(chip, (res.count||0)+' saved. '+res.errors.join(' '));
      toast((res.count||0)+' saved, some rejected', true);
      return;
    }
    optDone(chip, (res.count||0)+' expense'+((res.count||0)===1?'':'s')+' saved'+
          (res.fxIds&&res.fxIds.length?(' \u00b7 '+res.fxIds.join(', ')):''));
    toast((res.count||0)+' expense'+((res.count||0)===1?'':'s')+' saved');
    /* One bill can carry several heads sharing a single FX_ID, so one
       attachment correctly covers the whole bill. */
    if(attFile && res.fxIds && res.fxIds.length){
      attUploadBlob('FIXED', res.fxIds[0], attFile, 'Attached at entry')
        .then(function(r){ toast(r.attId+' \u00b7 '+r.fileName+' \u2192 '+res.fxIds[0]); })
        .catch(function(e){ toast('Expense saved, attachment failed: '+((e&&e.message)||'error')+
                                  ' \u2014 add it from the Bills tab', true); });
    }
  }).catch(function(e){
    optFail(chip, 'Not saved: '+((e&&e.message)||'connection failed'));
    toast((e&&e.message)||'Connection failed', true);
  });
}
