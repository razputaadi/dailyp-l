function reqRestore(d){
  if(!d) return;
  if(d.date) $('qDate').value=d.date;
  if(d.dept) $('qDept').value=d.dept;
  if(d.notes) $('qNotes').value=d.notes;
  $('qLines').innerHTML='';
  (d.rows||[]).forEach(function(r){
    addDocLine('qLines','rqItemsDL','Required');
    var ws=document.querySelectorAll('#qLines .docline');
    var w=ws[ws.length-1];
    w.querySelector('.dItem').value=r[0]||'';
    w.querySelector('.dQty').value=r[1]||'';
  });
  if(!(d.rows||[]).length) addDocLine('qLines','rqItemsDL','Required');
  toast('Draft restored');
}
/* Edit reuses the New form rather than a second one, same as the PO editor:
   the fields are identical and a separate editor is where the two drift apart.

   Only an Open requirement can be edited. Once anything has been issued, the
   server refuses — and rightly so: saving rewrites the line set with Qty Issued
   reset to zero, which would erase the record of goods that have physically
   left the store. A part-served requirement gets cancelled and re-raised for
   whatever is still wanted. */
var _editReqId=null;
function reqBeginEdit(reqId){
  api('listRequirements',{status:''}).then(function(res){
    if(!res.ok){ toast(res.error||'Failed', true); return; }
    var q=(res.reqs||[]).filter(function(x){ return x.reqId===reqId; })[0];
    if(!q){ toast('Requirement not found', true); return; }
    if(q.status!=='Open'){
      toast(reqId+' is '+q.status+' \u2014 only an Open requirement can be edited. '+
            'Cancel it and raise a new one for what is still needed.', true);
      return;
    }
    if(state.me.venue==='ALL'){
      toast('Pick a single venue in the bar above before editing '+reqId, true); return;
    }
    _editReqId=reqId;
    rqMode='new'; paintRqTabs();
    $('rqBody').innerHTML='<div class="stub">Loading\u2026</div>';
    ensureItems(function(){
      buildReqForm();
      $('qDate').value=q.date||todayStr();
      $('qDept').value=q.department||'';
      $('qNotes').value=q.notes||'';
      $('qLines').innerHTML='';
      q.lines.forEach(function(L){
        addDocLine('qLines','rqItemsDL','Required');
        var ws=document.querySelectorAll('#qLines .docline');
        var w=ws[ws.length-1];
        w.querySelector('.dItem').value=L.item||'';
        w.querySelector('.dQty').value=qn(L.qtyRequired);
        w.querySelector('.dUom').textContent=L.uom||'';
      });
      if(!q.lines.length) addDocLine('qLines','rqItemsDL','Required');
      $('qSubmit').textContent='Save changes to '+reqId;
      var bar=$('qDraftBar');
      if(bar) bar.innerHTML='<div class="msg" style="background:var(--warn-soft,#FFF4D6);'+
        'border:1px solid var(--warn,#9A6712)33;color:var(--warn,#9A6712);margin:0 0 10px">'+
        'Editing <b>'+esc(reqId)+'</b>. Saving replaces its item list.</div>';
    });
  }).catch(function(e){ toast((e&&e.message)||'Failed', true); });
}
function reqEndEdit(){ _editReqId=null; }
function submitRequirement(){
  var msg=$('qMsg'); msg.className='msg err'; msg.textContent='';
  var date=$('qDate').value, dept=$('qDept').value.trim();
  if(!date){ msg.textContent='Pick a date.'; return; }
  if(!dept){ msg.textContent='Choose a department.'; return; }
  var got=collectDocLines('qLines');
  if(got.unknown && got.unknown.length){
    var _qm=$('qMsg');
    if(_qm){ _qm.className='msg err';
      _qm.textContent='Not in Item Master: '+got.unknown.join(', ')+
        '. Pick from the list, or add it with "+ New item to master" first.'; }
    else toast('Not in Item Master: '+got.unknown.join(', '), true);
    return;
  }
  if(got.bad){ msg.textContent='Each line needs an item and a qty (or clear the line).'; return; }
  if(!got.rows.length){ msg.textContent='Add at least one item.'; return; }
  var editing=_editReqId;
  var payload={date:date, department:dept, notes:$('qNotes').value.trim(), rows:got.rows};
  if(editing) payload.reqId=editing;

  var label=(editing?('changes to '+editing)
                    :(dept+' \u00b7 '+got.rows.length+' item'+(got.rows.length===1?'':'s')));
  var chip=optChip('qStatus', label);
  draftClear('req');
  reqEndEdit();
  buildReqForm();

  api(editing?'updateRequirement':'createRequirement', payload).then(function(res){
    if(!res.ok){
      optFail(chip, 'Requirement not saved: '+(res.error||'failed'));
      toast(res.error||'Not saved', true);
      return;
    }
    optDone(chip, res.reqId+(editing?' updated':' raised')+' \u00b7 '+res.lines+' item(s)');
    toast(res.reqId+(editing?' updated':' raised'));
    if(activeTab==='requirements' && rqMode==='list') loadReqList();
    /* Every successful entry refreshes the reminder immediately, so the raiser
       sees it land. Other devices pick it up on their next foreground or poll —
       without push there is no way to reach a phone that is not looking. */
    reqAlertTick(true);
  }).catch(function(e){
    optFail(chip, 'Not saved: '+((e&&e.message)||'connection failed'));
    toast((e&&e.message)||'Connection failed', true);
  });
}
/* ensureItems is cached, so wrapping the list in it costs nothing after the first
   call and is what makes a real department list available for the filter. */
function loadReqList(){
  $('rqBody').innerHTML='<div class="stub">Loading\u2026</div>';
  ensureItems(function(){
    var deptOpts=(_itemsCache.departments||[]).map(function(d){
      return '<option value="'+esc(d)+'">'+esc(d)+'</option>'; }).join('');
    $('rqBody').innerHTML='<div class="stkctl">'+
        '<div class="field"><label>Status</label><select id="qFStat">'+
        '<option value="PENDING">Pending (Open + Partial)</option><option value="">All</option>'+
        '<option value="Open">Open</option><option value="Partial">Partial</option>'+
        '<option value="Issued">Issued</option><option value="Cancelled">Cancelled</option></select></div>'+
        '<div class="field"><label>Department</label><select id="qFDept">'+
        '<option value="">All departments</option>'+deptOpts+'</select></div>'+
        '<div class="field"><label>&nbsp;</label><button class="btn secondary small" id="qRef">Refresh</button></div></div>'+
      '<div id="qList"><div class="stub">Loading\u2026</div></div>';
    if($('qFDept') && _rqDeptFilter) $('qFDept').value=_rqDeptFilter;
    $('qFStat').onchange=fetchReqs;
    $('qFDept').onchange=fetchReqs;
    $('qRef').onclick=fetchReqs;
    fetchReqs();
  });
}
/* Remembered across rebuilds: loadReqList runs again after every cancel and after
   a fresh entry, and silently resetting the filter to All each time would be a
   small betrayal on a long list. */
var _rqDeptFilter='';
function fetchReqs(){
  var st=$('qFStat')?$('qFStat').value:'PENDING';
  var dp=$('qFDept')?$('qFDept').value:'';
  _rqDeptFilter=dp;
  $('qList').innerHTML='<div class="stub">Loading\u2026</div>';
  api('listRequirements',{status:st, department:dp}).then(function(res){
    if(!res.ok){ $('qList').innerHTML='<div class="msg err">'+esc(res.error||'Failed')+'</div>'; return; }
    if(!res.reqs.length){ $('qList').innerHTML='<div class="stub">Nothing here.</div>'; return; }
    $('qList').innerHTML=res.reqs.map(function(q){
      return '<div class="card" style="margin:8px 0;padding:12px" data-req="'+esc(q.reqId)+'">'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'+
          '<b>'+esc(q.reqId)+'</b>'+statusPill(q.status)+
          '<span style="font-size:12px;color:var(--muted)">'+esc(q.date)+' \u00b7 '+esc(q.department)+
          ' \u00b7 '+esc(q.venue)+(q.ageDays>0?(' \u00b7 '+q.ageDays+'d old'):'')+'</span></div>'+
        '<div style="font-size:13px;margin-bottom:8px">'+q.lines.map(function(L){
          var pend=(L.pending>0)?(' <span style="color:var(--warn)">pending '+qn(L.pending)+'</span>'):'';
          return esc(L.item)+' \u2014 need '+qn(L.qtyRequired)+' '+esc(L.uom||'')+
                 ', issued '+qn(L.qtyIssued)+pend;
        }).join('<br>')+'</div>'+
        (q.notes?('<div class="sub" style="margin:0 0 8px">'+esc(q.notes)+'</div>'):'')+
        '<div class="actions" style="gap:6px;flex-wrap:wrap">'+
          (((q.status==='Open'||q.status==='Partial')&&cap('Action: Issue vs Requirement'))?
            '<button class="btn small rq-issue">Issue pending</button>':'')+
          ((q.status==='Open'&&cap('Entry: Requirement'))?
            '<button class="btn secondary small rq-edit">Edit</button>':'')+
          (((q.status==='Open'||q.status==='Partial')&&cap('Entry: Requirement'))?
            '<button class="btn secondary small rq-cancel">Cancel</button>':'')+
        '</div></div>';
    }).join('');
    res.reqs.forEach(function(q){
      var card=document.querySelector('[data-req="'+q.reqId+'"]');
      if(!card) return;
      var bi=card.querySelector('.rq-issue'), bc=card.querySelector('.rq-cancel'),
          be=card.querySelector('.rq-edit');
      if(be) be.onclick=function(){ reqBeginEdit(q.reqId); };
      if(bi) bi.onclick=function(){ reqToIssue(q.reqId); };
      if(bc) bc.onclick=function(){
        armConfirm(bc, 'Cancel '+q.reqId+'? Anything already issued stays recorded.', function(){
          api('cancelRequirement',{reqId:q.reqId}).then(function(r){
            if(!r.ok){ toast(r.error||'Failed', true); return; }
            toast(q.reqId+' cancelled \u00b7 anything already issued stays recorded');
            fetchReqs();
          }).catch(function(){ toast('Could not reach the server', true); });
        });
      };
    });
  }).catch(function(e){ $('qList').innerHTML='<div class="msg err">'+esc((e&&e.message)||'Failed')+'</div>'; });
}
function reqToIssue(reqId){
  api('getREQForIssue',{reqId:reqId}).then(function(r){
    if(!r.ok){ toast(r.error||'Failed', true); return; }
    /* Issue prefill rows are [date, reqSr, item, qty, dept, by1, by2, notes].
       Only the PENDING quantity is filled, so a part-served requirement can
       never re-issue what has already left the store. */
    var rows=r.rows.map(function(L){
      return [todayStr(), reqId, L[0], L[1], r.department, '', '', 'Against '+reqId];
    });
    if(!cap('Entry: Issue')){
      toast('You do not have Issue entry rights \u2014 ask someone with them to serve '+reqId, true);
      return;
    }
    if(state.me.venue==='ALL'){
      toast('Pick a single venue in the bar above before issuing against '+reqId, true);
      return;
    }
    _pendingPrefill={type:'issue', rows:rows};
    _issueReqId=reqId;
    iMode='form'; activeTab='issues'; renderTabs();
    toast('Adjust quantities if needed, then submit');
  }).catch(function(e){ toast((e&&e.message)||'Failed', true); });
}

/* ---------------- Bills: attach + verify ---------------- */
function renderBills(m){
  var canUp=cap('Action: Upload Attachment');
  m.innerHTML='<div class="card"><h2>Bills</h2>'+
    '<div class="sub">Attach the bill image or PDF, then mark it verified against the entry. '+
      'Max 5 MB per file.</div>'+
    '<div class="subtabs">'+(canUp?'<button id="blAtt">Missing attachments</button>':'')+
      '<button id="blVer">Verify</button></div>'+
    '<div id="blBody"></div></div>';
  if(!canUp) blMode='verify';
  if($('blAtt')) $('blAtt').onclick=function(){ blMode='attach'; paintBlTabs(); blShow(); };
  $('blVer').onclick=function(){ blMode='verify'; paintBlTabs(); blShow(); };
  paintBlTabs(); blShow();
}
function paintBlTabs(){
  if($('blAtt')) $('blAtt').className=(blMode==='attach'?'active':'');
  $('blVer').className=(blMode==='verify'?'active':'');
}
function blShow(){ if(blMode==='attach') loadMissing(); else loadVerify(); }
function blRange(){
  return '<div class="stkctl">'+
    '<div class="field"><label>From</label><input type="date" id="blFrom" value="'+esc(rpMonthStart())+'"></div>'+
    '<div class="field"><label>To</label><input type="date" id="blTo" value="'+esc(todayStr())+'"></div></div>';
}
function loadMissing(){
  $('blBody').innerHTML=blRange()+
    '<div class="actions"><button class="btn secondary small" id="blGo">Show</button></div>'+
    '<div id="blList"><div class="stub">Pick a range and press Show.</div></div>';
  $('blGo').onclick=fetchMissing;
  fetchMissing();
}
function fetchMissing(){
  $('blList').innerHTML='<div class="stub">Loading\u2026</div>';
  api('getBillVerificationReport',{fromKey:$('blFrom').value, toKey:$('blTo').value}).then(function(res){
    if(!res.ok){ $('blList').innerHTML='<div class="msg err">'+esc(res.error||'Failed')+'</div>'; return; }
    var sec=(res.sections||[]).filter(function(s){ return s.title.indexOf('NO attachment')>=0; })[0];
    var rows=(sec&&sec.rows)||[];
    if(!rows.length){ $('blList').innerHTML='<div class="stub">Every bill in this range has an attachment.</div>'; return; }
    /* Rows: [Type, ID, Date, Vendor, Bill No, Lines, Amount, Venue] */
    $('blList').innerHTML='<div class="sub" style="margin:8px 0">'+rows.length+
      ' bill(s) with no attachment, largest first.</div>'+
      rows.map(function(r,i){
        return '<div class="card" style="margin:8px 0;padding:12px" data-miss="'+i+'">'+
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'+
            '<b>'+esc(r[1])+'</b>'+statusPill(r[0])+
            '<span style="font-size:12px;color:var(--muted)">'+esc(r[2])+' \u00b7 '+
            esc(r[3]||'no vendor')+' \u00b7 '+esc(r[4]||'no bill no')+' \u00b7 '+esc(r[7])+'</span></div>'+
          '<div style="font-size:13px;margin-bottom:8px">'+esc(r[0])+' \u00b7 '+r[5]+
            ' line(s) \u00b7 <b>\u20b9'+Number(r[6]).toFixed(2)+'</b></div>'+
          '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
            '<input type="file" class="miFile" style="flex:2;min-width:160px;font-size:12px">'+
            '<input class="miRem" placeholder="Remark (optional)" style="flex:1.4;min-width:0">'+
            '<button class="btn small miUp">Upload</button></div>'+
          '<div class="msg mi-msg"></div></div>';
      }).join('');
    rows.forEach(function(r,i){
      var card=document.querySelector('[data-miss="'+i+'"]');
      if(!card) return;
      card.querySelector('.miUp').onclick=function(){
        attUpload(r[0], r[1], card.querySelector('.miFile'),
                  card.querySelector('.mi-msg'), card.querySelector('.miRem').value.trim(),
                  card.querySelector('.miUp'), fetchMissing);
      };
    });
  }).catch(function(e){ $('blList').innerHTML='<div class="msg err">'+esc((e&&e.message)||'Failed')+'</div>'; });
}
/* Read the file as base64 and post it. The 5 MB ceiling is checked here too:
   base64 inflates the payload by a third, and Apps Script's POST body limit still
   applies, so failing early with a clear message beats a timeout. */
/* Promise core: read a File as base64 and post it. Shared by the entry forms
   (which upload once a parent ID exists) and by the Bills tab. */
function attUploadBlob(parentType, parentId, file, remarks){
  return new Promise(function(resolve, reject){
    if(!file){ reject(new Error('No file')); return; }
    if(file.size > 5*1024*1024){
      reject(new Error((file.size/1048576).toFixed(1)+' MB exceeds the 5 MB limit')); return;
    }
    var fr=new FileReader();
    fr.onerror=function(){ reject(new Error('Could not read that file')); };
    fr.onload=function(){
      var b64=String(fr.result||''); var c=b64.indexOf(',');
      if(c>=0) b64=b64.substring(c+1);
      api('uploadAttachment',{parentType:parentType, parentId:parentId, fileName:file.name,
          mimeType:file.type||'application/octet-stream', base64:b64,
          remarks:remarks||''}).then(function(r){
        if(!r.ok){ reject(new Error(r.error||'Upload failed')); return; }
        resolve(r);
      }).catch(reject);
    };
    fr.readAsDataURL(file);
  });
}
function attUpload(parentType, parentId, fileEl, msgEl, remarks, btn, onDone){
  msgEl.className='msg err'; msgEl.textContent='';
  var f=fileEl.files && fileEl.files[0];
  if(!f){ msgEl.textContent='Choose a file first.'; return; }
  btn.disabled=true; btn.textContent='Uploading\u2026';
  attUploadBlob(parentType, parentId, f, remarks).then(function(r){
    btn.disabled=false; btn.textContent='Upload';
    toast(r.attId+' \u00b7 '+r.fileName+' ('+r.sizeKB+' KB)');
    if(onDone) onDone();
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Upload';
    msgEl.className='msg err'; msgEl.textContent=(e&&e.message)||'Connection failed';
  });
}
function loadVerify(){
  $('blBody').innerHTML=blRange()+
    '<div class="stkctl"><div class="field"><label>Status</label><select id="blStat">'+
      '<option value="">All</option><option value="Pending">Pending</option>'+
      '<option value="Verified">Verified</option><option value="Mismatch">Mismatch</option></select></div>'+
      '<div class="field"><label>&nbsp;</label><button class="btn secondary small" id="blGo2">Show</button></div></div>'+
    '<div id="blList2"><div class="stub">Loading\u2026</div></div>';
  $('blGo2').onclick=fetchVerify; $('blStat').onchange=fetchVerify;
  fetchVerify();
}
function fetchVerify(){
  $('blList2').innerHTML='<div class="stub">Loading\u2026</div>';
  api('listAttachments',{fromKey:$('blFrom').value, toKey:$('blTo').value,
                         status:$('blStat').value}).then(function(res){
    if(!res.ok){ $('blList2').innerHTML='<div class="msg err">'+esc(res.error||'Failed')+'</div>'; return; }
    if(!res.rows.length){ $('blList2').innerHTML='<div class="stub">No attachments in this range.</div>'; return; }
    var canV=cap('Action: Verify Bill');
    $('blList2').innerHTML=res.rows.map(function(a){
      return '<div class="card" style="margin:8px 0;padding:12px" data-att="'+esc(a.attId)+'">'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px">'+
          '<b>'+esc(a.attId)+'</b>'+statusPill(a.status)+
          '<span style="font-size:12px;color:var(--muted)">'+esc(a.date)+' \u00b7 '+
          esc(a.parentType)+' '+esc(a.parentId)+' \u00b7 '+esc(a.venue)+'</span></div>'+
        '<div style="font-size:13px;margin-bottom:6px">'+esc(a.vendor||'no vendor')+
          ' \u00b7 '+esc(a.billNo||'no bill no')+' \u00b7 <b>\u20b9'+Number(a.amount).toFixed(2)+'</b></div>'+
        '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">'+
          '<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.fileName)+'</a>'+
          ' \u00b7 '+a.sizeKB+' KB \u00b7 uploaded by '+esc(a.uploadedBy||'?')+
          (a.verifiedBy?(' \u00b7 '+esc(a.status)+' by '+esc(a.verifiedBy)+' on '+esc(a.verifiedOn)):'')+
          (a.remarks?('<br>'+esc(a.remarks)):'')+'</div>'+
        (canV?('<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
          '<input class="avRem" placeholder="Remark" value="'+esc(a.remarks||'')+'" style="flex:2;min-width:0">'+
          '<button class="btn small av-ok">Verified</button>'+
          '<button class="btn secondary small av-bad">Mismatch</button>'+
          '<button class="btn secondary small av-pend">Pending</button></div>'):'')+
        (state.me.isOwner?('<div class="actions"><button class="btn secondary small av-del">Delete</button></div>'):'')+
        '<div class="msg av-msg"></div></div>';
    }).join('');
    res.rows.forEach(function(a){
      var card=document.querySelector('[data-att="'+a.attId+'"]');
      if(!card) return;
      var msg=card.querySelector('.av-msg');
      function setStat(st){
        var rem=card.querySelector('.avRem');
        api('verifyAttachment',{attId:a.attId, status:st, remarks:rem?rem.value.trim():''}).then(function(r){
          if(!r.ok){ msg.className='msg err'; msg.textContent=r.error||'Failed'; return; }
          toast(a.attId+' \u2192 '+st); fetchVerify();
        }).catch(function(e){ msg.className='msg err'; msg.textContent=(e&&e.message)||'Failed'; });
      }
      var b1=card.querySelector('.av-ok'), b2=card.querySelector('.av-bad'),
          b3=card.querySelector('.av-pend'), bd=card.querySelector('.av-del');
      if(b1) b1.onclick=function(){ setStat('Verified'); };
      if(b2) b2.onclick=function(){ setStat('Mismatch'); };
      if(b3) b3.onclick=function(){ setStat('Pending'); };
      if(bd) bd.onclick=function(){
        armConfirm(bd, 'Delete '+a.attId+'? The Drive file goes to trash for 30 days.', function(){
          api('deleteAttachment',{attId:a.attId}).then(function(r){
            if(!r.ok){ msg.className='msg err'; msg.textContent=r.error||'Failed'; return; }
            toast(a.attId+' deleted \u00b7 file is in Drive trash for 30 days');
            fetchVerify();
          }).catch(function(){ msg.className='msg err'; msg.textContent='Could not reach the server'; });
        });
      };
    });
  }).catch(function(e){ $('blList2').innerHTML='<div class="msg err">'+esc((e&&e.message)||'Failed')+'</div>'; });
}

/* ---------------- service worker: install + update ----------------
   Registered last so a failure here can never stop the app booting. The bar only
   appears when a NEW worker has finished installing and is waiting, which is the
   one moment a reload actually changes anything. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').then(function(reg){
      if(reg.waiting){ showUpdateBar(reg); return; }
      reg.addEventListener('updatefound', function(){
        var nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBar(reg);
        });
      });
    }).catch(function(){ /* offline or unsupported \u2014 app still works */ });
    var reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(reloaded) return; reloaded=true; location.reload();
    });
  });
}
