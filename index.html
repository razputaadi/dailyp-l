  r.push(['Comp income ('+Math.round((t.compPct||0)*100)+'%)', rpN2(t.compIncome)]);
  r.push(['Staff food income', rpN2(t.staffFoodIncome)]);
  r.push(['Returns (add back)', rpN2(t.totalReturn)]);
  r.push(['— Deductions —','']);
  r.push(['Consumption', rpN2(t.totalCons)]);
  r.push(['Zomato commission', rpN2(t.zomatoComm)]);
  r.push(['Swiggy commission', rpN2(t.swiggyComm)]);
  r.push(['Zomato ads', rpN2(t.zomatoAds)]);
  r.push(['Swiggy ads', rpN2(t.swiggyAds)]);
  r.push(['GROSS PROFIT', rpN2(t.grossProfit)]);
  r.push(['Gross Profit %', ((t.grossProfitPct||0)*100).toFixed(1)+'%']);
  r.push(['Less: Fixed expenses ('+t.dayCount+'d)', rpN2(t.fixedExp)]);
  (t.expenseHeads||[]).forEach(function(h){ r.push(['  '+(h.name||h.head||h.label||''), rpN2(h.amount!=null?h.amount:(h.total!=null?h.total:h.value))]); });
  r.push(['Less: Other expenses', rpN2(t.otherExpTotal)]);
  r.push(['NET PROFIT', rpN2(t.netProfit)]);
  r.push(['Net Profit Margin', ((t.netProfitMargin||0)*100).toFixed(1)+'%']);
  r.push(['— Info —','']);
  r.push(['Comp sale (net)', rpN2(t.compSale)]);
  r.push(['Cancelled sale', rpN2(t.cancelledSale)]);
  r.push(['Spoilage value', rpN2(t.totalSpo)]);
  (t.paymentTypes&&t.paymentTypes.length) && r.push(['— Sales by Payment —','']);
  (t.paymentTypes||[]).forEach(function(p){ r.push(['  '+p.paymentType, rpN2(p.totalAmount)]); });
  return r;
}
function rpTableFromPnL(res){ return { headers:['Line','Amount'], rows:rpPnlStatement(res) }; }
/* ══ SUMMARY P&L — MANAGEMENT FORMAT ═══════════════════════════════
   Renders getPnLPack into the fifteen sections of the printed management pack,
   in the same order, so the on-screen report and the circulated PDF are the same
   document. Every figure comes from the server payload; the only arithmetic done
   here is the break-even block, because its target % is a report input and doing
   it locally lets the target be changed without another archive read.
   ═══════════════════════════════════════════════════════════ */
var _rpBeTarget = 35;      // break-even target consumption %, from the report input
var _rpFixedOn  = true;    // 'Calculate Fixed expenses from backend' - report input

function rpP(v){ return (typeof v==='number' && isFinite(v)) ? ((v*100).toFixed(2)+'%') : '\u2014'; }
function rpNum(v){ return rpN2(typeof v==='number' ? v : 0); }

/* Rows for a Particulars / Amount / % of Net Sales block. pct is computed here
   rather than server-side so a zero-sales period shows a dash instead of a
   division artefact. */
function rpPnlRows(ns, list){
  return list.map(function(x){
    var amt=x[1]||0;
    return [x[0], rpNum(amt), (ns>0 ? rpP(amt/ns) : '\u2014')];
  });
}

function rpTableFromPnLPack(res){
  var P=res.period||{}, inc=P.income||{}, dir=P.direct||{}, ind=P.indirect||{},
      memo=P.memo||{}, fd=P.food||{}, bv=P.bev||{};
  var S=[], days=P.days||1;

  /* ── INCOME, bifurcated ────────────────────────────────────────────────────
     Restaurant and aggregator are netted SEPARATELY because their GST behaves
     differently, and the single 'NET SALES' line up to v22 hid that.

     res.a1 is the gross-by-order-type list the deleted Annexure 1 used to print.
     _wsGetPnLPack still returns it, so the split is a front-end change with no
     backend edit. Restaurant is defined as every order type that is NOT an
     aggregator - built from the data, so a new order type appears on the report
     by itself instead of vanishing into a bucket nobody reconciles.

     GST treatment, which is the whole reason for the split:
       - Restaurant: inc.gstOnSales in full. Under GST s.9(5) the aggregator is
         liable for tax on supplies made through its platform, so aggregator
         invoices carry NO tax in the sales archive. There is nothing to
         double-count by charging the entire figure here.
       - Aggregator: the 5% embedded in the gross remittance, gross - gross/1.05.
         It never reaches us, so it is a deduction from income. To v22 it sat in
         Direct Expenses instead. Moving it is arithmetically neutral on Gross
         Profit - income falls and direct expenses fall by the same amount - but
         it lowers Total Income, which is the base for every ratio below. */
  var a1=res.a1||[];
  var restLines=[], restGross=0, zGross=0, sGross=0;
  a1.forEach(function(o){
    var amt=o.amount||0, ot=String(o.orderType||'');
    if(/zomato/i.test(ot))      zGross+=amt;
    else if(/swiggy/i.test(ot)) sGross+=amt;
    else { restLines.push([ot, amt]); restGross+=amt; }
  });
  var restGST=inc.gstOnSales||0;
  var netRest=restGross-restGST;
  /* Aggregator sales are entered NET of GST, so there is nothing to deduct here.
     AGG_GST_PCT is 0 server-side, which makes dir.zomatoGST / dir.swiggyGST zero
     too; this reads them anyway so the block still balances if that constant is
     ever put back to 0.05 for gross-entered data. */
  var aggGST=(dir.zomatoGST||0)+(dir.swiggyGST||0);
  var netAgg=zGross+sGross-aggGST;
  var comp=inc.compIncome||0, staff=inc.staffFoodIncome||0;
  var ti=netRest+netAgg+comp+staff;
  var pctTI=function(a){ return ti>0 ? rpP(a/ti) : '\u2014'; };
  var pctOf=function(a,b){ return b>0 ? rpP(a/b) : '\u2014'; };
  var rowsTI=function(list){ return list.map(function(x){ var a=x[1]||0; return [x[0], rpNum(a), pctTI(a)]; }); };

  var netCons=(dir.consumption||0)+(dir.openingStock||0)-(inc.returnsAddBack||0);
  var aggCost=(dir.zomatoComm||0)+(dir.swiggyComm||0)+(dir.zomatoAds||0)+(dir.swiggyAds||0);
  var aTot=netCons+aggCost+(dir.deTotal||0);
  var gp=ti-aTot, gpm=ti>0?(gp/ti):0;

  /* Fixed expenses are a REPORT INPUT now: 'No' excludes the backend figure
     entirely instead of pulling Fixed_Expenses x days. Done client-side from the
     payload rather than as a server flag, so toggling costs no round trip and no
     redeploy, exactly like the break-even target. */
  var fixedOn=(_rpFixedOn!==false);
  var fixed=fixedOn?(ind.fixed||0):0;
  var bTot=fixed+(ind.other||0);
  var np=gp-bTot, npm=ti>0?(np/ti):0;

  var _wk=rpWeekendCounts(P.fromKey, P.toKey);
  /* aTot, gp, bTot and np are all computed above this point, so the glance block can
     lead with the same figures the detailed sections reach later.

     Labels here are TITLE CASE on purpose. rpRowClass styles the section totals by
     matching UPPER CASE - 'TOTAL DIRECT EXPENSES (A)' - so title case keeps these two
     as plain glance rows rather than repeating the heavy grand-total banding inside a
     summary block. Same convention as 'Net Profit / (Loss)' here versus
     'NET PROFIT / (LOSS)' below; the rule is documented in rpRowClass. */
  S.push({ title:'PERIOD AT A GLANCE', headers:['Measure','Value'], rows:[
    ['Total Income (Annx-1)', rpNum(ti)],
    ['Total Direct Expenses (A)', rpNum(aTot)],
    ['Gross Profit / (Loss) (Annx-2)', rpNum(gp)],
    ['Total Indirect Expenses (B)', rpNum(bTot)],
    ['Net Profit / (Loss) (Annx-3)', rpNum(np)],
    ['Net Profit / Loss Margin', rpP(npm)],
    ['Saturdays in period', _wk.sat],
    ['Sundays in period', _wk.sun]
  ]});

  var incLines=[];
  restLines.forEach(function(r){ incLines.push([r[0], r[1]]); });
  /* The two GST lines MUST carry distinct labels. rpMergeOne keys comparison
     rows by label within a section, so two rows both called 'Less: GST on above
     Sales' would collide and the second would overwrite the first in compare
     mode - silently, with a plausible-looking number. */
  incLines.push(['Less: GST on Restaurant Sales', -restGST]);
  incLines.push(['Net Restaurant Sales', netRest]);
  if(zGross) incLines.push(['Zomato', zGross]);
  if(sGross) incLines.push(['Swiggy', sGross]);
  if(aggGST) incLines.push(['Less: GST on Aggregator Sales', -aggGST]);
  incLines.push(['Net Aggregator Sales', netAgg]);
  incLines.push(['Add: Complimentary Income (billed at 0%)', comp]);
  incLines.push(['Add: Staff Food Income', staff]);
  incLines.push(['Annx-1: TOTAL INCOME', ti]);
  S.push({ title:'INCOME BIFURCATION',
    headers:['Particulars','Amount (Rs.)','% of Total Income'], rows:rowsTI(incLines) });

  var aLines=[
    ['Consumption \u2014 Food, Beverage & Stores', dir.consumption||0],
    ['Add: Opening Stock at Departments', dir.openingStock||0],
    ['Less: Closing Stock at Departments', -(inc.returnsAddBack||0)],
    ['Net Consumptions', netCons],
    ['Zomato Commission', dir.zomatoComm||0],
    ['Swiggy Commission', dir.swiggyComm||0],
    ['Zomato Advertisement', dir.zomatoAds||0],
    ['Swiggy Advertisement', dir.swiggyAds||0]
  ];
  (dir.deHeads||[]).forEach(function(h){ aLines.push(['Direct expense \u2014 '+h.head, h.amount]); });
  aLines.push(['TOTAL DIRECT EXPENSES (A)', aTot]);
  S.push({ title:'A. DIRECT EXPENSES (variable cost of sales)',
    headers:['Particulars','Amount (Rs.)','% of Total Income'], rows:rowsTI(aLines) });

  /* Tripwire. Gross Profit under this layout is algebraically identical to the
     server's P.grossProfit - the aggregator-GST move cancels between income and
     direct expenses - so any divergence means the payload and this renderer
     disagree about a line, which is precisely what Annexure 6 used to catch
     before it was removed. Printed only when it actually breaks. */
  var gpRows=[
    ['Annx-2: GROSS PROFIT (Annx-1 \u2212 A)', rpNum(gp)],
    ['Gross Profit Margin (on Total Income)', rpP(gpm)]
  ];
  if(Math.abs(gp-(P.grossProfit||0))>1){
    gpRows.push(['\u26a0 Reconciliation',
      'This block computes Gross Profit as '+rpNum(gp)+' but the server reports '+
      rpNum(P.grossProfit||0)+'. A line item is being counted differently by the two. '+
      'Do not rely on the figures below until this is nil.']);
  }
  S.push({ title:'Annx-2: GROSS PROFIT', headers:['Measure','Value'], rows:gpRows });

  var bLines=[];
  if(!fixedOn){
    bLines.push(['Fixed Expenses \u2014 EXCLUDED (not calculated from backend)', 0]);
  } else if(ind.fixedHeads && ind.fixedHeads.length){
    /* Bifurcation by head when the backend supplies it. Falls back to the single
       total so this renderer works against both the current payload and the one
       that will carry fixedHeads. */
    ind.fixedHeads.forEach(function(h){ bLines.push(['Fixed \u2014 '+h.head, h.amount]); });
  } else {
    bLines.push(['Fixed Expenses', fixed]);
  }
  (ind.otherHeads||[]).forEach(function(h){ bLines.push(['Other \u2014 '+h.head, h.amount]); });
  bLines.push(['TOTAL INDIRECT EXPENSES (B)', bTot]);
  S.push({ title:'B. INDIRECT EXPENSES (fixed / period costs)',
    headers:['Particulars','Amount (Rs.)','% of Total Income'], rows:rowsTI(bLines) });

  S.push({ title:'Annx-3: NET PROFIT / (LOSS)', headers:['Measure','Value'], rows:[
    ['Annx-3: NET PROFIT / (LOSS) (Annx-2 \u2212 B)', rpNum(np)],
    ['Net Profit Margin (on Total Income)', rpP(npm)]
  ]});

  S.push({ title:'KEY PERFORMANCE INDICATORS', headers:['Indicator','Value'], rows:[
    ['Gross Sale per Day (Restaurant and Aggregator Sales)', rpNum((restGross+zGross+sGross)/days)],
    ['Net Sales per Day (Restaurant and Aggregator Sales)', rpNum((netRest+netAgg)/days)],
    ['Consumption % of Total Income', pctTI(netCons)],
    ['Direct Expense % of Total Income', pctTI(aTot)],
    ['Indirect Expense per Day', rpNum(bTot/days)],
    ['Indirect Expense % of Total Income', pctTI(bTot)],
    ['Aggregator Sale (Zomato + Swiggy)', rpNum(netAgg)],
    ['Aggregator Cost (commission + ads)', rpNum(aggCost)],
    ['Aggregator Cost % of Aggregator Sale', pctOf(aggCost, netAgg)]
  ]});

  /* BREAK-EVEN on the ACTUAL gross profit margin: Total Indirect / GP margin.
     This is a change of meaning, not just of formula. To v22 break-even was
     solved at the TARGET consumption %, so moving the target moved the answer.
     It is now solved at the cost structure actually achieved, which makes the
     target an assumption printed for reference only - it no longer feeds the
     number. The section title says so rather than inviting a re-run that
     changes nothing. */
  var tgt=(parseFloat(_rpBeTarget)||0)/100;
  var beRows=[
    ['Target Consumption % of Total Income (assumption, not used below)', rpP(tgt)],
    ['Actual Consumption % of Total Income', pctTI(netCons)],
    ['Aggregator & other direct cost % of Total Income (actual)', pctTI(aggCost+(dir.deTotal||0))],
    ['Fixed + Other expenses % of Total Income', pctTI(bTot)]
  ];
  if(ti>0 && bTot>ti){
    beRows.push(['\u26a0 Fixed cost',
      'Fixed and other period costs alone exceed Total Income, so break-even is unattainable at this volume even at zero food cost.']);
  }
  if(gpm>0){
    var beInc=bTot/gpm;
    beRows.push(['Break-even Total Income required for the period', rpNum(beInc)]);
    beRows.push(['Break-even Total Income required per Day', rpNum(beInc/days)]);
    beRows.push(['Gap vs. Actual Total Income (negative = shortfall)', rpNum(ti-beInc)]);
  } else {
    beRows.push(['\u26a0 At actual cost',
      'Gross profit margin is nil or negative, so every additional rupee of sale increases the loss. Volume alone cannot fix this \u2014 cost % must come down too.']);
    beRows.push(['Break-even Total Income required for the period', 'Not attainable']);
  }
  S.push({ title:'BREAK-EVEN ANALYSIS (on actual gross profit margin)',
    headers:['Particulars','Amount / %'], rows:beRows });

  /* Each memo line is a percentage of its OWN base, not of one shared base, so
     rowsTI cannot be used here - the third column is built per row. */
  var baseSales=netRest+netAgg;
  S.push({ title:'MEMO / INFORMATION ITEMS',
    headers:['Particulars','Amount (Rs.)','% of Their Values'], rows:[
      ['Trade Discount Given (% of Aggregator and Restaurant Sales)', rpNum(memo.discount), pctOf(memo.discount||0, baseSales)],
      ['Complimentary Sale (% of Total Income)', rpNum(memo.compSale), pctOf(memo.compSale||0, ti)],
      ['Cancelled Sale (% of Aggregator and Restaurant Sales)', rpNum(memo.cancelledSale), pctOf(memo.cancelledSale||0, baseSales)],
      ['Spoilage Value (% of Net Consumptions)', rpNum(memo.spoilage), pctOf(memo.spoilage||0, netCons)]
    ]});

  /* ── FOOD & BEVERAGE COST, folded in ──────────────────────────────────────
     Was its own report to v22. It needs NO extra server call: _wsGetPnLPack and
     _wsGetFoodCostReport both built their period from _pnlPeriod_, and that
     function already returns the food and bev blocks - the pack has been
     carrying them all along and this renderer simply ignored them. One call, and
     the two views cannot drift apart because there is only one of them now.

     'Total Sales' in these blocks is the food-cost report's own base (net food
     sales + comp food + staff food) and is deliberately NOT Total Income above.
     ON THE SAME BASIS AS Annx-1 ─────────────────────────────────────────────
     No adjustment is needed and none is made. With aggregator sales entered net of
     GST, both totals reduce to the same expression:

        fd.totalSales + bv.totalSales = m.netSales + comp + staff
        Total Income (Annx-1)         = m.netSales + comp + staff

     so they tie identically. The pro-rata GST apportionment that used to sit here
     is gone with the GST it was correcting for - and with it the proxy of splitting
     a department-level figure across categories by inference. If AGG_GST_PCT is
     ever restored to 0.05 for gross-entered data, the two totals will diverge by
     that amount again and the tripwire below will say so. */
  var cSales=(fd.totalSales||0)+(bv.totalSales||0), cCost=(fd.cost||0)+(bv.cost||0);

  var combRows=[
    ['Food Total Sales', rpNum(fd.totalSales)],
    ['Beverage Total Sales', rpNum(bv.totalSales)],
    ['Total Sales (Food + Beverage)', rpNum(cSales)],
    ['Food Cost', rpNum(fd.cost)],
    ['Cost of Beverages', rpNum(bv.cost)],
    ['TOTAL COST (Food + Beverage)', rpNum(cCost)],
    ['Combined Cost %', pctOf(cCost, cSales)],
    ['Combined Cost per Day', rpNum(cCost/days)],
    /* rpnoprint: on screen, never in the PDF or JPEG. */
    ['\u26a0 Basis', 'Total Sales (Food + Beverage) is net food and beverage sales plus complimentary and staff food, which is the same base as Total Income (Annx-1) above \u2014 the two agree. '+(res.bevNote||'')]
  ];
  if(Math.abs(cSales-ti)>1){
    combRows.push(['\u26a0 Reconciliation',
      'Total Sales (Food + Beverage) is '+rpNum(cSales)+' but Total Income (Annx-1) is '+
      rpNum(ti)+'. These must agree \u2014 do not rely on the cost percentages until they do.']);
  }
  S.push({ title:'FOOD & BEVERAGE COST \u2014 COMBINED', headers:['Particulars','Amount (Rs.)'], rows:combRows });

  S.push({ title:'FOOD COST', headers:['Particulars','Amount (Rs.)'], rows:[
    ['Food Net Sales (excl. Beverages)', rpNum(fd.netSales)],
    ['Income From Comp Sales (Food)', rpNum(fd.compIncome)],
    ['Income From Staff Food', rpNum(fd.staffFoodIncome)],
    ['Total Sales (Food)', rpNum(fd.totalSales)],
    ['Food Cost', rpNum(fd.cost)],
    ['Food Cost %', pctOf(fd.cost||0, fd.totalSales||0)],
    ['Food Cost per Day', rpNum((fd.cost||0)/days)]
  ]});

  S.push({ title:'BEVERAGE COST', headers:['Particulars','Amount (Rs.)'], rows:[
    ['Beverages Sales (net)', rpNum(bv.netSales)],
    ['Comp. Beverage Sale', rpNum(bv.compIncome)],
    ['Total Beverage Sales', rpNum(bv.totalSales)],
    ['Cost of Beverages', rpNum(bv.cost)],
    ['Beverage Cost %', pctOf(bv.cost||0, bv.totalSales||0)],
    ['Beverage Cost per Day', rpNum((bv.cost||0)/days)]
  ]});

  /* ── AGGREGATOR PROFIT & LOSS ──────────────────────────────────────────────
     A standalone P&L for the delivery channel, so it can be judged on its own
     rather than buried inside the venue total. Rendered as a section like MEMO and
     the KPIs, at the owner's confirmation.

     EVERY sale-side particular is a Sales_Archive column, named as the sheet names
     it, in sheet order: base (items sale) E, tax F, discount G, delivery H,
     container I, service J, additional K, deducted L, waived M, round off N,
     total O. Nothing here is derived or apportioned. Figures are per INVOICE, not
     per line - charges sit on the invoice, so summing them per row would multiply
     each by its number of item lines.

     Payment Handling Fees is the one expense that is NOT in Sales_Archive - that
     sheet has no such column. It comes from PnL_Expenses_Archive, matched by head
     name, as the owner specified.

     Food & beverage cost was removed at the owner's instruction. It had been
     reverse-calculated from the combined cost % - an allocation, not a
     measurement, since issues are recorded per department and never per sales
     channel. Net Profit here is therefore BEFORE any food cost. */
  var AGG_PL_SALARY_PER_DAY = 400;
  var ap = dir.aggParts || {};
  var apNet = ap.netOrder || 0;
  var apSalary = AGG_PL_SALARY_PER_DAY * days;

  /* Found by name across BOTH head lists, because the owner types it into
     PnL_Expenses_Archive and it may be typed DE or IDI. Matches 'payment' plus
     handl/gateway/process, or a bare 'handling fee'. */
  /* Widened after a test showed 'Razorpay Gateway Charges' - a perfectly ordinary way
     to name this head - matched nothing, because 'Razorpay' contains 'pay' but not
     'payment'. A bare 'gateway charge/fee' is unambiguous enough in a restaurant
     expense list to accept on its own. Still deliberately narrow: it will not match a
     head that merely mentions payment, such as 'Payment to Vendor'. */
  var _apFeeRe=/(payment.*(handl|gateway|process))|(handling\s*fee)|(gateway\s*(charge|fee))/i;
  var apFee=0, apFeeHeads=[];
  [].concat(dir.deHeads||[], ind.otherHeads||[]).forEach(function(h){
    if(_apFeeRe.test(String(h.head||''))){ apFee+=(h.amount||0); apFeeHeads.push(h.head); }
  });

  var apComm = (dir.zomatoComm||0)+(dir.swiggyComm||0);
  var apAds  = (dir.zomatoAds||0)+(dir.swiggyAds||0);
  var apExp  = apComm+apAds+apFee+apSalary;
  var apNP   = apNet-apExp;
  var apPct  = function(a){ return apNet>0 ? rpP(a/apNet) : '\u2014'; };

  /* Four named particulars, everything else folded into one line, nil rows hidden.

     'Other Charges / Adjustments' is computed as the RESIDUAL, not as a sum of the
     remaining columns:
         other = netOrder - itemsSale - container - delivery + discount
     so the block ties to Net Order Value by construction and nothing can leak. A
     sum of named columns would depend on the sign convention the POS uses for
     service, additional, deducted, waived, round off and tax - and if that
     convention were wrong the total would quietly stop agreeing with Annx-1.

     The column-by-column sum is still computed, as aggParts.other server-side, and
     compared against this residual purely as a tripwire. It fires only when the two
     disagree, which would mean the assumed composition of the invoice total is
     wrong. That row is NOT suppressed and NOT screen-only - a real mismatch must
     reach the printed report.

     Nil rows are suppressed throughout, at the owner's instruction. Net Order Value,
     TOTAL EXPENSES and Annx-4 always print, because a block whose totals vanish at
     zero is worse than one with a zero in it. Note the consequence for Payment
     Handling Fees: while no matching expense head exists it is nil and therefore
     hidden, and the Basis row is the only place that says so. */
  var apOther = apNet - (ap.itemsSale||0) - (ap.container||0) - (ap.delivery||0) + (ap.discount||0);
  var apRows=[];
  var apAdd=function(label, v, always){
    v=v||0;
    if(always || Math.abs(v)>0.005) apRows.push([label, rpNum(v), apPct(v)]);
  };
  apAdd('A. Items Sale', ap.itemsSale);
  apAdd('Container Charge', ap.container);
  apAdd('Delivery Charge', ap.delivery);
  apAdd('Other Charges / Adjustments', apOther);
  apAdd('Less: Discount', -(ap.discount||0));
  apRows.push(['Net Order Value', rpNum(apNet), apPct(apNet)]);

  /* Threshold is RELATIVE, not absolute. The residual and the column sum differ by
     the rounding carried on every invoice, so across a thousand orders a few rupees
     of drift is normal and means nothing: a flat 0.005 tolerance fired on 7.22 out
     of 363,961, which is noise wearing a warning label. 0.01% of Net Order Value,
     floored at Rs 1, ignores that and still catches a real structural mismatch. */
  var _apTol=Math.max(1, apNet*0.0001);
  if(Math.abs(apOther-(ap.other||0))>_apTol){
    apRows.push(['\u26a0 Composition',
      'Other Charges / Adjustments is '+rpNum(apOther)+' as a residual, but the named Sales_Archive columns (service, additional, deducted, waived, round off, tax) sum to '+
      rpNum(ap.other||0)+'. The residual is used, so Net Order Value is still correct, but the invoice total is not composed the way this report assumes.', '']);
  }

  apRows.push(['\u2014 Expenses \u2014','','']);
  apAdd('Commission (Zomato + Swiggy)', apComm);
  apAdd('Advertisement (Zomato + Swiggy)', apAds);
  /* The matched head name is appended only when it ADDS something. The owner's head
     is itself called 'Payment Handling Fees', so appending it produced 'Payment
     Handling Fees - Payment Handling Fees'. Compared on a loose key (lower-cased,
     non-alphanumerics stripped) so 'payment-handling fees' or 'Payment Handling Fee'
     are recognised as the same label too; a genuinely different head, say 'Razorpay
     Gateway Charges', still shows so it is clear what was picked up. */
  var _apLbl='Payment Handling Fees';
  var _apLoose=function(x){ return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''); };
  var _apExtra=apFeeHeads.filter(function(h){ return _apLoose(h)!==_apLoose(_apLbl); });
  apAdd(_apLbl+(_apExtra.length?(' \u2014 '+_apExtra.join(', ')):''), apFee);
  apAdd('Salary \u2014 1 person at '+rpNum(AGG_PL_SALARY_PER_DAY)+'/day \u00d7 '+days+' days', apSalary);
  apRows.push(['TOTAL EXPENSES', rpNum(apExp), apPct(apExp)]);
  apRows.push(['Annx-4: AGGREGATOR NET PROFIT / (LOSS)', rpNum(apNP), apPct(apNP)]);

function rpFmt(v){
  if(v==null) return '';
  /* Safety net for binary-float noise. A figure that is really 112.10 can arrive as
     112.10000000000001; String() would print all seventeen significant digits, which
     looks broken on screen and, in a CSV, exceeds what a spreadsheet parses as a
     plain number - the cell lands as TEXT and will not sum.

     Six decimals is far more than any figure in this system carries, so this cannot
     lose real precision; it only discards the representation error. Handlers should
     still round at source - this catches the one that forgets. Numbers only: strings
     and dates pass through untouched. */
  if(typeof v==='number'){
    if(!isFinite(v)) return '';
    return String(Math.round(v*1e6)/1e6);
  }
  var s=String(v);
  var mm=s.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(mm) return mm[3]+'-'+mm[2]+'-'+mm[1];
  return s;
}
/* Row styling for the management pack. Matches the ACTUAL labels the P&L emits:
   the old exact-match patterns (/^GROSS PROFIT$/) never fired against
   'GROSS PROFIT (A - B)', which is why the report rendered flat. Ordered most
   specific first \u2014 'Add:'/'Less:' is tested after the TOTAL patterns so a
   subtotal is never demoted to a stock line. */
/* Takes the WHOLE row now, not just the label, because the Annx-2 / Annx-3
   banners and the two margin rows are coloured by the SIGN of their figure and
   the label alone cannot tell us that. row[1] is the base period's value; in
   compare mode rpMergeOne puts the comparison in row[2], so keying off row[1]
   colours the row by the base period, which is what the heading leads with. */
function rpRowClass(first, row){

  var neg=function(){ return !!(row && row.length>1 && rpIsNeg(row[1])); };
  /* Screen-only. rpnoprint rows are hidden by the PDF and JPEG exporters and
     restored afterwards, so an explanatory row can live on the report without
     appearing in the printed copy.

     'Basis' and 'Composition' are both notes about HOW a figure was built - the
     figures themselves are correct either way, so they belong on screen and not on
     paper. 'Reconciliation' is deliberately NOT in this list: it fires only when two
     figures that must agree do not, which means the numbers are wrong, and that has
     to reach the printed copy. */
  if(/^\u26a0 (Basis|Composition)/.test(s)) return 'rpwarn rpnoprint';
  /* Same amber block as a warning, but NO rpnoprint: a remark that qualifies a
     headline figure has to survive into the printed copy. */
  if(/^Remarks$/i.test(s)) return 'rpwarn';
  if(/^\u26a0/.test(s)) return 'rpwarn';
  if(/^Annx-1: TOTAL INCOME$/i.test(s)) return 'rphi';
  if(/^Annx-4: AGGREGATOR NET PROFIT/i.test(s)) return neg() ? 'rphired' : 'rphi';
  if(/^Net Order Value$/i.test(s)) return 'rpsub';
  if(/^TOTAL EXPENSES$/i.test(s)) return 'rpgrand';
  if(/^Annx-[23]:/i.test(s)) return neg() ? 'rphired' : 'rphi';
  if(/^(Gross|Net) Profit Margin \(on Total Income\)$/i.test(s)) return neg() ? 'rpnegrow' : 'rpposrow';
  if(/^TOTAL INCOME \(A\)$/i.test(s)) return 'rphi';
  if(/^GROSS PROFIT \(A - B\)$/i.test(s)) return 'rphi';
  if(/^NET PROFIT \/ \(LOSS\)/.test(s)) return 'rphi';   // case-SENSITIVE: the title-case
                                                        // 'Net Profit / (Loss)' in PERIOD AT A
                                                        // GLANCE must stay unbannered
  if(/^GROSS PROFIT as per P&L Statement$/i.test(s)) return 'rphi';
  /* case-SENSITIVE: the sections emit 'TOTAL DIRECT EXPENSES (A)' in caps and want the
     grand-total band. PERIOD AT A GLANCE emits 'Total Direct Expenses (A)' in title
     case and must stay a plain row - the same split already used for NET PROFIT. */
  if(/^TOTAL (DIRECT|INDIRECT) EXPENSES/.test(s)) return 'rpgrand';
  if(/^TOTAL COST \(Food \+ Beverage\)$/i.test(s)) return 'rpgrand';
  if(/^NET SALES$/i.test(s)) return 'rpgrand';
  if(/^(GRAND TOTAL|TOTAL|Total|Total Gross Sale|Total Collection)$/.test(s)) return 'rpgrand';

  if(/^Net (Restaurant|Aggregator) Sales$/i.test(s)) return 'rpsub';
  if(/^Net Consumptions$/i.test(s)) return 'rpsub';

   to a string, so no negative in the management pack was ever coloured. Detect a

   placeholder is never mistaken for one. */
function rpIsNeg(c){
  if(typeof c==='number') return c<0;
  return /^\s*-\s*\d/.test(String(c==null?'':c));
}
function rpOneTable(headers, rows){
  var head='<tr>'+(headers||[]).map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr>';
  var body=(rows||[]).map(function(r){
    var cls=rpRowClass(r[0], r);
    var cells=r.map(function(c,i){
      var v=rpFmt(c), cc='';
      if(i>0 && rpIsNeg(c)) cc=' class="rpneg"';
      return '<td'+cc+'>'+esc(v)+'</td>';
    }).join('');
    return '<tr'+(cls?(' class="'+cls+'"'):'')+'>'+cells+'</tr>';
  }).join('');
  return '<div class="matrix-wrap"><table class="matrix rptbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}
function rpRenderTable(t){
  var b=$('rpBody');
  if(t.sections){
    if(!t.sections.length){ b.innerHTML='<div class="stub">No data.</div>'; return; }
    /* Each section wrapped in .rpsect so rpExportPdf can paginate on section
       boundaries instead of slicing one tall canvas mid-row. */
    b.innerHTML=t.sections.map(function(s){ return '<div class="rpsect"><div class="rpsecttitle">'+esc(s.title)+'</div>'+rpOneTable(s.headers, s.rows)+'</div>'; }).join('');
    return;
  }
  if(!t.rows||!t.rows.length){ b.innerHTML='<div class="stub">No data for this selection.</div>'; return; }
  b.innerHTML='<div class="rptmeta">'+t.rows.length+' row'+(t.rows.length>1?'s':'')+'</div>'+rpOneTable(t.headers, t.rows);

function rpCsvCell(v){ var s=String(v==null?'':v); if(/[",\n\r]/.test(s)) s='"'+s.replace(/"/g,'""')+'"'; return s; }
/* Screen-only rows are skipped here too.
   rpnoprint is a DOM class, so hiding it works for the PDF and JPEG - which capture
   the rendered page - but the CSV is built from the DATA and never saw it. The Basis
   and Composition notes were therefore still landing in the spreadsheet, in the
   amount column, after being removed from every other export. Same rule, applied to
   the row label instead of the element. */
function _rpCsvSkip(r){
  return /rpnoprint/.test(rpRowClass((r&&r[0])||'', r));
}
function rpExportCsv(){
  if(!_rpTable){ return; }
  var lines=[];
  if(_rpTable.sections){
    _rpTable.sections.forEach(function(s,i){
      if(i>0) lines.push('');
      lines.push(rpCsvCell(s.title));
      lines.push((s.headers||[]).map(rpCsvCell).join(','));
      (s.rows||[]).forEach(function(r){
        if(_rpCsvSkip(r)) return;
        lines.push(r.map(function(c){ return rpCsvCell(rpFmt(c)); }).join(','));
      });
    });
  }else{
    lines.push((_rpTable.headers||[]).map(rpCsvCell).join(','));
    (_rpTable.rows||[]).forEach(function(r){
      if(_rpCsvSkip(r)) return;
      lines.push(r.map(function(c){ return rpCsvCell(rpFmt(c)); }).join(','));
    });
  }
  var csv=lines.join('\r\n');
  var name=(_rpLabel||'report').replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'')+'_'+todayStr()+'.csv';
  try{
    var blob=new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 800);
    toast('CSV downloaded');
  }catch(e){
    var b=$('rpBody');
    b.insertAdjacentHTML('afterbegin','<div class="sub">Download blocked — copy the CSV below:</div><textarea class="rpcsvta" readonly></textarea>');
    b.querySelector('.rpcsvta').value=csv;
  }
}

var _impState={};
function impAutoMap(headers, fields){
  var norm=headers.map(sNorm), used={}, map={};
  fields.forEach(function(f){ for(var i=0;i<norm.length;i++){ if(used[i]) continue; if(f.aliases.indexOf(norm[i])>=0){ map[f.k]=i; used[i]=true; return; } } });
  fields.forEach(function(f){ if(f.k in map) return; for(var i=0;i<norm.length;i++){ if(used[i]||!norm[i]) continue; for(var a=0;a<f.aliases.length;a++){ if(norm[i].indexOf(f.aliases[a])>=0){ map[f.k]=i; used[i]=true; return; } } } });
  fields.forEach(function(f){ if(!(f.k in map)) map[f.k]=-1; });
  return map;
}

function impRead(hostId, file){

function impChunk(rows, fieldIndex, groupKeys, size){
  if(!groupKeys || !groupKeys.length){ var o=[]; for(var i=0;i<rows.length;i+=size) o.push(rows.slice(i,i+size)); return o; }
  var groups={}, order=[];
  rows.forEach(function(r){ var key=groupKeys.map(function(fk){ return String(r[fieldIndex[fk]]||''); }).join('||'); if(!groups[key]){ groups[key]=[]; order.push(key); } groups[key].push(r); });
  var chunks=[], cur=[];
  order.forEach(function(key){ var g=groups[key]; if(cur.length && (cur.length+g.length)>size){ chunks.push(cur); cur=[]; } cur=cur.concat(g); });
  if(cur.length) chunks.push(cur);
  return chunks;
}
function impSubmit(hostId){
  var st=_impState[hostId], cfg=st.cfg, msg=$(hostId+'Msg'); msg.className='msg err'; msg.textContent='';
  var missing=cfg.fields.filter(function(f){ return f.req && (st.map[f.k]==null || st.map[f.k]<0); });
  if(missing.length){ msg.textContent='Map these required fields: '+missing.map(function(f){ return f.label; }).join(', '); return; }
  var fieldIndex={}; cfg.fields.forEach(function(f,i){ fieldIndex[f.k]=i; });
  var data=st.rows.slice(1).map(function(r){ return cfg.fields.map(function(f){ var ci=st.map[f.k]; return (ci>=0 && r[ci]!=null)?String(r[ci]).trim():''; }); })
    .filter(function(r){ return r.some(function(c){ return c!==''; }); });
  if(!data.length){ msg.textContent='No rows to import.'; return; }
  var chunks=impChunk(data, fieldIndex, cfg.groupBy, 300);
  var idx=0, saved=0, errs=[], total=data.length, done=0, btn=$(hostId+'Sub'), prog=$(hostId+'Prog');
  btn.disabled=true;
  function step(){
    if(idx>=chunks.length){
      btn.disabled=false;
      prog.innerHTML='<div class="savechip ok" style="margin-top:10px"><span class="sc-tick">✓</span><span class="sc-text">Imported '+saved+' of '+total+' rows'+(errs.length?(' · '+errs.length+' issues'):'')+'</span></div>'+
        (errs.length?('<div class="msg err">'+esc(errs.slice(0,6).join('  |  '))+(errs.length>6?'  …':'')+'</div>'):'');
      return;
    }
    var slice=chunks[idx]; done+=slice.length;
    prog.innerHTML='<div class="savechip saving" style="margin-top:10px"><span class="spin sc-spin"></span><span class="sc-text">Saving '+done+' / '+total+'…</span></div>';
    api(cfg.action, {rows:slice}).then(function(res){
      if(res&&res.ok){ saved+=res.count||0; if(res.errors&&res.errors.length) errs=errs.concat(res.errors); }
      else { errs.push((res&&res.error)||'chunk failed'); }
      idx++; step();
    }).catch(function(e){ errs.push((e&&e.message)||'chunk failed'); idx++; step(); });
  }
  step();
}

// preload venue display names (best-effort; also refreshed after login via listVenues)
/* ── Boot ──────────────────────────────────────────────────────────────────
   Two different faults were indistinguishable to whoever was holding the phone,
   and both of them read as "it logged me out":

     1. #login is visible in the markup and #app is hidden, so for the whole time
        bootstrap was in flight — 2 to 5 seconds against an Apps Script cold
        start — the SIGN IN CARD was what you were looking at. Nothing was
        wrong. It simply looked exactly like being signed out, every launch.
     2. The old catch cleared the token on ANY rejection. call() rejects on
        "Failed to fetch", on HTTP 500, on the 180s timeout, and on a non-JSON
        reply. So one weak-signal moment at launch destroyed a valid session and
        made someone type their password again for no reason at all.

   Now a stored token hides the login card immediately and shows a restoring
   screen. A REFUSAL from the server signs you out. A failure to REACH the server
   does not — it retries, then offers a button, and the token stays saved. */
(function init(){
  var t=loadSession();
  if(!t) return;
  state.session=t;

  var sp=document.createElement('div');
  sp.id='bootSplash';
  sp.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;'+
    'align-items:center;justify-content:center;gap:14px;background:var(--bg,#EEF1EF);'+
    'font:15px/1.5 var(--ui,system-ui);color:var(--ink,#14201C);text-align:center;padding:24px';
  sp.innerHTML='<div style="font-family:var(--display,system-ui);font-weight:700;font-size:22px">'+
    'GYV <span style="opacity:.45">\u00b7</span> Ambria</div>'+
    '<div id="bootMsg" style="opacity:.65;font-size:13px">Restoring session\u2026</div>'+
    '<div id="bootAct"></div>';
  document.body.appendChild(sp);
  $('login').classList.add('hidden');

  function done(){ if(sp.parentNode) sp.parentNode.removeChild(sp); }
  function toLogin(why){
    done();
    state.session=null; saveSession('');
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    if(why) $('loginMsg').textContent=why;
  }
  /* Three tries, widening. Absorbs a cold start and a lift-tunnel moment without
     making a genuine outage take a minute to report. */
  var waits=[0, 2500, 6000], n=0;
  function attempt(){
    bootstrap().then(done).catch(function(e){
      if(e && e.authFail){ toLogin('Your session expired. Please sign in again.'); return; }
      n++;
      if(n<waits.length){
        $('bootMsg').textContent='Server not responding \u2014 retrying\u2026 ('+n+'/'+(waits.length-1)+')';
        setTimeout(attempt, waits[n]);
        return;
      }
      /* Out of retries. As far as we know the token is still perfectly good, so
         it stays saved and nobody is sent to the login screen over a bad signal. */
      $('bootMsg').textContent='Could not reach the server. Your sign-in is still saved.';
      $('bootAct').innerHTML='<button class="btn" id="bootRetry" style="min-width:170px">Try again</button>'+
        '<div style="margin-top:12px"><a href="#" id="bootSignout" '+
        'style="font-size:12px;opacity:.55;color:inherit">Sign in as someone else</a></div>';
      $('bootRetry').onclick=function(){
        n=0; $('bootAct').innerHTML=''; $('bootMsg').textContent='Restoring session\u2026'; attempt();
      };
      $('bootSignout').onclick=function(ev){ ev.preventDefault(); toLogin(''); };
    });
  }
  attempt();
})();

/* One hook for the whole app. 0ms, not 50: a MutationObserver callback runs before
   paint, so this still coalesces a form rebuild into one pass but strips the
   attribute before the input can be tapped. */
(function acWatch(){
  function run(){ try{ acUpgrade(); }catch(e){} }
  try{
    var mo=new MutationObserver(function(){ clearTimeout(mo._t); mo._t=setTimeout(run,0); });
    mo.observe(document.body,{childList:true,subtree:true});
  }catch(e){}
  run();
})();

/* ═══════════════════════════════════════════════════════════════════════
   ADD AN ITEM TO Item_Master FROM AN ENTRY FORM

   PO and Requirement both REJECT an item that is not in Item_Master, because a
   typo there travels to the vendor and then into a purchase, and that is how
   the name-drift / phantom-stock problem starts. Rejecting is right, but it left
   a dead end: the only way out was to leave the form, edit the sheet, come back
   and retype everything. This panel closes that loop without weakening the
   check — the item is created properly first, then used.

   Opening quantity is deliberately NOT offered here. Opening stock lives in
   Opening_Stock and the FIFO engine keys it as OPEN_<ItemName>; letting a
   purchase form mint an opening layer would create stock nobody ever bought.
   New items therefore start at zero and get their first layer from a real
   purchase, which is the only honest source.
   ═══════════════════════════════════════════════════════════════════════ */
function _uniqFrom(list, key){
  var seen={}, out=[];
  (list||[]).forEach(function(x){
    var v=String((x&&x[key])||'').trim();
    if(v && !seen[v.toLowerCase()]){ seen[v.toLowerCase()]=true; out.push(v); }
  });
  return out.sort(function(a,b){ return a.toLowerCase()<b.toLowerCase()?-1:1; });
}
/* Pick the line that should receive the new name: the first empty item input,
   otherwise the last one — so the name lands somewhere usable either way. */
function _pickTargetInput(hostId, sel){
  var ins=document.querySelectorAll('#'+hostId+' '+sel);
  if(!ins.length) return null;
  for(var i=0;i<ins.length;i++){ if(!ins[i].value.trim()) return ins[i]; }
  return ins[ins.length-1];
}
function openNewItemPanel(opts){
  var slot=$(opts.slotId);
  if(!slot) return;
  if(slot.firstChild){ slot.innerHTML=''; return; }   // toggle closed
  var target=_pickTargetInput(opts.hostId, opts.itemSel);
  var seed=(target && target.value.trim()) || '';
  var cats=_uniqFrom(_itemsCache.items,'category').map(function(c){ return '<option value="'+esc(c)+'"></option>'; }).join('');
  var uoms=_uniqFrom(_itemsCache.items,'uom').map(function(u){ return '<option value="'+esc(u)+'"></option>'; }).join('');
  slot.innerHTML=''+
    '<div class="card" style="margin:8px 0;padding:12px;border-color:var(--accent)">'+
      '<datalist id="niCatDL">'+cats+'</datalist><datalist id="niUomDL">'+uoms+'</datalist>'+
      '<div style="font:600 13px/1.4 inherit;margin-bottom:2px">New item in Item_Master</div>'+
      '<div class="sub" style="margin:0 0 8px">Starts at zero stock. Its first FIFO layer comes '+
        'from a real purchase.</div>'+
      '<div class="pbill">'+
        '<div class="field full"><label>Item name</label>'+
          '<input id="niName" value="'+esc(seed)+'" autocapitalize="words" placeholder="Exact name as you want it everywhere"></div>'+
        '<div class="field"><label>Category</label><input id="niCat" list="niCatDL" placeholder="Type or pick"></div>'+
        '<div class="field"><label>UOM</label><input id="niUom" list="niUomDL" placeholder="kg / Pkt / Ltr"></div>'+
      '</div>'+
      '<div class="actions"><button class="btn small" id="niSave">Add to master</button>'+
        '<button class="btn secondary small" id="niCancel">Cancel</button></div>'+
      '<div class="msg" id="niMsg"></div>'+
    '</div>';
  $('niCancel').onclick=function(){ slot.innerHTML=''; };
  $('niName').focus();
  $('niSave').onclick=function(){
    var msg=$('niMsg'); msg.className='msg err'; msg.textContent='';
    var name=$('niName').value.trim();
    var cat=$('niCat').value.trim();
    var uom=$('niUom').value.trim();
    if(!name){ msg.textContent='Item name is required.'; return; }
    if(!uom){ msg.textContent='UOM is required \u2014 without it quantities mean nothing.'; return; }
    var clash=(_itemsCache.items||[]).filter(function(x){
      return String(x.name).trim().toLowerCase()===name.toLowerCase(); })[0];
    if(clash){
      msg.textContent='"'+clash.name+'" already exists in Item_Master. Use that spelling.';
      return;
    }
    /* Adding an item also writes it into the Storekeeper workbook, and opening a
       second spreadsheet is the slow part of that call. So the UI commits first
       and reconciles after: the name goes into the local cache and the waiting
       line straight away, the panel closes, and the round trip finishes in the
       background. Failure is rare here because an exact duplicate was already
       rejected above, and if it does fail the name is pulled back out of the
       cache so nothing is left pointing at an item that does not exist. */
    _itemsCache.items.push({name:name, category:cat, uom:uom});
    if(target){
      target.value=name;
      /* PO and Requirement lines show a UOM hint beside the item; purchase lines
         have no such element, hence the null check. */
      var wrap=target.parentNode;
      var us=wrap && wrap.querySelector('.dUom');
      if(us) us.textContent=uom;
    }
    slot.innerHTML='';
    var chip=optChip(opts.statusId || 'oStatus', '"'+name+'" \u2192 Item_Master');
    function unwind(why){
      _itemsCache.items=(_itemsCache.items||[]).filter(function(x){
        return String(x.name).trim().toLowerCase()!==name.toLowerCase(); });
      if(target && target.value===name) target.value='';
      optFail(chip, '"'+name+'" was not added: '+why);
      toast('"'+name+'" was not added \u2014 '+why, true);
    }
    api('pushNewItems',{items:[[name, cat, uom, 0, 0, 0]]}).then(function(res){
      if(!res.ok){ unwind(res.error||'rejected'); return; }
      if(!res.count){ unwind('the server already had '+((res.skipped||[]).join(', ')||'it')); return; }
      optDone(chip, '"'+name+'" added to Item_Master');
      toast('"'+name+'" added');
    }).catch(function(e){
      unwind((e&&e.message)||'connection failed');
    });
  };
}

/* ═══════════════════════════════════════════════════════════════════════
   DRAFT PERSISTENCE

   A stray reload, a backgrounded tab that the OS kills, or a mis-tap on the
   browser refresh used to wipe a half-typed bill. Every keystroke in an entry
   form is now mirrored to localStorage and restored when the form is rebuilt.

   Only in-progress typing is stored — the draft is cleared the moment the
   server accepts the entry, so a restored draft can never duplicate a saved
   record. Storage is namespaced per user AND per venue: restoring an ARC bill
   into ACJ would be worse than losing it.
   ═══════════════════════════════════════════════════════════════════════ */
function draftKey(name){
  var u=(state.me&&state.me.username)||'anon';
  var v=(state.me&&state.me.venue)||'-';
  return 'gyvDraft:'+name+':'+u+':'+v;
}
function draftSave(name, obj){
  /* No username means no owner, and an ownerless draft would be offered back to
     whoever logs in next on this device. Skip it rather than pool it under
     'anon'. */
  if(!(state.me && state.me.username)) return;
  try{ localStorage.setItem(draftKey(name), JSON.stringify({t:Date.now(), d:obj})); }catch(e){}
}
function draftLoad(name){
  if(!(state.me && state.me.username)) return null;
  try{
    var raw=localStorage.getItem(draftKey(name));
    if(!raw) return null;
    var p=JSON.parse(raw);
    /* Anything older than 12h is stale enough that silently repopulating it
       would confuse more than it helps. */
    if(!p || !p.d || (Date.now()-(p.t||0)) > 12*3600*1000){ draftClear(name); return null; }
    return p.d;
  }catch(e){ return null; }
}
function draftClear(name){ try{ localStorage.removeItem(draftKey(name)); }catch(e){} }
function draftHas(name){ return !!draftLoad(name); }

/* Wire a form for autosave. `read` returns a plain object; it is called on any
   input/change inside the host element, debounced so typing stays smooth. */
function draftWatch(hostId, name, read){
  var host=$(hostId);
  if(!host) return;
  var t=null;
  function flush(){ try{ draftSave(name, read()); }catch(e){} }
  host.addEventListener('input', function(){ clearTimeout(t); t=setTimeout(flush, 400); }, true);
  host.addEventListener('change', function(){ clearTimeout(t); t=setTimeout(flush, 200); }, true);
}

/* A small banner offering to bring a draft back, rather than restoring silently
   — an unexpected pre-filled form is alarming when you meant to start fresh. */
function draftBanner(name, onRestore){
  var d=draftLoad(name);
  if(!d) return '';
  window['_draftRestore_'+name]=function(){
    onRestore(draftLoad(name));
    var el=$('draftBar_'+name); if(el) el.style.display='none';
  };
  window['_draftDiscard_'+name]=function(){
    draftClear(name);
    var el=$('draftBar_'+name); if(el) el.style.display='none';
  };
  return '<div id="draftBar_'+name+'" class="msg" style="background:var(--warn-soft,#FFF4D6);'+
    'border:1px solid var(--warn,#9A6712)33;color:var(--warn,#9A6712);display:flex;gap:8px;'+
    'align-items:center;flex-wrap:wrap;margin:0 0 10px">'+
    '<span style="flex:1;min-width:140px">Unsaved entry found from your last session.</span>'+
    '<button class="btn small" onclick="_draftRestore_'+name+'()">Restore</button>'+
    '<button class="btn secondary small" onclick="_draftDiscard_'+name+'()">Discard</button></div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   PROCUREMENT + BILLS  (Orders · Receiving · Requirements · Bills)

   Purchase Orders, Goods Receipts and Requirements are INTENT documents:
   none of them move stock. Stock is written only when the chain ends in the
   existing Purchase form (FIFO layer) or Issue form (allocation). That is why
   a PO can be cancelled or a requirement abandoned with no stock risk.
   ═══════════════════════════════════════════════════════════════════════ */

var _convertGrnId=null;   /* set when a GRN is pushed into the Purchase form */
var _issueReqId=null;     /* set when a Requirement is pushed into the Issue form */
var oMode='new', rcMode='receive', rqMode='new', blMode='attach';
function cap(n){ return !!(state.me.caps||{})[n]; }
function qn(v){ var x=Math.round((parseFloat(v)||0)*1000)/1000; return String(x); }
function statusPill(st){
  var c={'Queued':'#5C6B66','Processing':'#9A6712','Done':'#0F5C4A',
         'Failed':'#A5322F','Stuck':'#A5322F',
         'Draft':'#9A6712','Sent':'#0F5C4A','Received':'#0F5C4A','Cancelled':'#A5322F',
         'Open':'#9A6712','Partial':'#9A6712','Issued':'#0F5C4A','Converted':'#5C6B66',
         'Pending':'#9A6712','Verified':'#0F5C4A','Mismatch':'#A5322F'}[st]||'#5C6B66';
  return '<span style="font:600 11px/1 var(--display,inherit);letter-spacing:.04em;'+
    'text-transform:uppercase;color:'+c+';border:1px solid '+c+'33;background:'+c+'14;'+
    'padding:3px 7px;border-radius:999px;white-space:nowrap">'+esc(st||'')+'</span>';
}
/* window.confirm() cannot be used in this app. HtmlService renders the page in
   a cross-origin iframe, and Chrome blocks alert/confirm/prompt from those: the
   call returns false immediately without showing anything, so a guarded action
   silently does nothing at all. (The original cockpit used confirm() zero times
   for exactly this reason.)

   This was first solved by arming the button for a second tap within 4 seconds.
   That failed in practice: you read the warning, think, then tap — and by then
   the timer has already reset, so the next tap merely re-arms. You can loop
   forever without the action ever firing. Timing has no business gating an
   irreversible step, so there is no timer here at all: the button is swapped for
   an explicit question with two labelled buttons, and it waits as long as needed. */
function armConfirm(btn, msg, onYes){
  if(!btn || btn._asking) return;
  btn._asking=true;
  var label=btn.textContent;
  var box=document.createElement('div');
  box.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px';
  box.innerHTML='<span style="flex:1;min-width:150px;font-size:13px;color:var(--warn,#9A6712)">'+
    esc(msg||'Are you sure?')+'</span>';
  var yes=document.createElement('button');
  yes.type='button'; yes.className='btn small'; yes.textContent=label;
  var no=document.createElement('button');
  no.type='button'; no.className='btn secondary small'; no.textContent='Cancel';
  box.appendChild(yes); box.appendChild(no);
  btn.style.display='none';
  /* Drop the question BELOW the button row, not inside it: .actions is a flex
     row, so a third item there gets squeezed on a narrow screen. */
  var row=btn.closest ? btn.closest('.actions') : null;
  if(row && row.parentNode) row.parentNode.insertBefore(box, row.nextSibling);
  else btn.parentNode.insertBefore(box, btn.nextSibling);
  function close(){
    if(box.parentNode) box.parentNode.removeChild(box);
    btn.style.display=''; btn._asking=false;
  }
  no.onclick=function(){ close(); };
  yes.onclick=function(){ close(); onYes(); };
}

/* Shared item+qty line editor used by the PO and Requirement forms. */
function addDocLine(hostId, dlId, phQty){
  var wrap=document.createElement('div');
  wrap.className='docline';
  wrap.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:6px';
  wrap.innerHTML='<input class="dItem" list="'+dlId+'" placeholder="Item" style="flex:3;min-width:0">'+
    '<input class="dQty" type="text" inputmode="decimal" placeholder="'+esc(phQty||'Qty')+'" style="flex:1.1;min-width:0">'+
    '<span class="dUom" style="flex:.8;min-width:0;font-size:12px;color:var(--muted)"></span>'+
    '<button class="pDel" type="button" title="Remove line">\u00d7</button>';
  $(hostId).appendChild(wrap);
  var it=wrap.querySelector('.dItem');
  attachItemAC(it, dlId);
  it.onchange=function(){
    var nm=it.value.trim().toLowerCase();
    var hit=(_itemsCache.items||[]).filter(function(x){ return String(x.name).toLowerCase()===nm; })[0];
    wrap.querySelector('.dUom').textContent=hit?(hit.uom||''):'';
  };
  wrap.querySelector('.pDel').onclick=function(){ wrap.parentNode.removeChild(wrap); };
  revealRow(wrap, it);
}
function collectDocLines(hostId){
  var rows=[], bad=false, unknown=[];
  Array.prototype.forEach.call(document.querySelectorAll('#'+hostId+' .docline'), function(w){
    var el=w.querySelector('.dItem');
    /* Requirement and Purchase Order both come through here, and both were left
       unguarded: the blur handler clears a bad name, but typing one and tapping
       Raise requirement without leaving the field never fires blur — and on a
       phone that is the normal way to submit, not the exception. */
    /* Guarded on purpose. If acItemUnknown were ever missing, an unguarded call
       here throws ReferenceError inside a click handler — which surfaces
       nowhere and just makes Raise requirement do nothing at all. A validation
       convenience must never be able to stop a save. */
    var u=(typeof acItemUnknown==='function')?acItemUnknown(el):''; if(u) unknown.push(u);
    var it=el.value.trim(), q=w.querySelector('.dQty').value;
    if(!it && q===''){ return; }
    if(!it || q===''){ bad=true; return; }
    rows.push([it, q]);
  });
  return { rows:rows, bad:bad, unknown:unknown };
}

/* ═══════════════════════════════════════════════════════════════════════
   OPTIMISTIC SUBMIT

   Purchase and Issue have always cleared the form the instant you submit and
   reported progress in a chip, so you can start the next entry immediately.
   Purchase Order, Requirement and Fixed expense did not: they disabled the
   button and froze the whole form until the server answered. On a phone that
   reads as the app hanging, which is what it was doing.

   Every write is now recorded in Submission_Queue before it executes, so the
   entry is durable the moment the server acknowledges it. That is what makes
   clearing the form early safe rather than reckless: nothing can be lost by
   moving on.
   ═══════════════════════════════════════════════════════════════════════ */
var _optSeq = 0;
function optChip(statusId, label){
  var host = $(statusId);
  if(!host) return null;
  var id = 'oc' + (++_optSeq);
  var chip = document.createElement('div');
  chip.className = 'savechip saving';
  chip.id = id;
  chip.innerHTML = '<span class="spin sc-spin"></span><span class="sc-text">Saving ' +
                   esc(label) + '\u2026</span>';
  host.appendChild(chip);
  return id;
}
function optDone(chipId, text){
  var c = $(chipId); if(!c) return;
  c.className = 'savechip ok';
  c.innerHTML = '<span class="sc-tick">\u2713</span><span class="sc-text">' + esc(text) + '</span>';
  setTimeout(function(){ if(c && c.parentNode) c.parentNode.removeChild(c); }, 3600);
}
function optFail(chipId, text){
  var c = $(chipId); if(!c) return;
  c.className = 'savechip error';
  c.innerHTML = '<span class="sc-text">' + esc(text) + '</span>';
}

function poRestore(d){
  if(!d) return;
  if(d.date) $('oDate').value=d.date;
  if(d.vendor) $('oVendor').value=d.vendor;
  if(d.exp) $('oExp').value=d.exp;
  if(d.notes) $('oNotes').value=d.notes;
  $('oLines').innerHTML='';
  (d.rows||[]).forEach(function(r){
    addDocLine('oLines','poItemsDL','Qty');
    var ws=document.querySelectorAll('#oLines .docline');
    var w=ws[ws.length-1];
    w.querySelector('.dItem').value=r[0]||'';
    w.querySelector('.dQty').value=r[1]||'';
  });
  if(!(d.rows||[]).length) addDocLine('oLines','poItemsDL','Qty');
  toast('Draft restored');
}
/* Edit reuses the create form rather than a second one: the fields are
   identical and a divergent editor is where the two drift out of sync.
   Only a Draft can be edited — the server enforces that too, since a PO that
   has gone to a vendor must not change underneath them. */
var _editPoId=null;
function poBeginEdit(poId){
  /* One request, not two. The old first call fetched the vendor message and threw
     it away, costing a round trip on every Edit tap. */
  api('listPOs',{status:''}).then(function(res){
    if(!res.ok){ toast(res.error||'Failed', true); return; }
    var po=(res.pos||[]).filter(function(x){ return x.poId===poId; })[0];
    if(!po){ toast('PO not found', true); return; }
    if(po.status!=='Draft' && po.status!=='Sent'){
      toast(poId+' is '+po.status+' \u2014 only a Draft or Sent PO can be edited', true); return;
    }
    _editPoId=poId;
    oMode='new'; paintOTabs();
    $('oBody').innerHTML='<div class="stub">Loading\u2026</div>';
    ensureItems(function(){
      buildPOForm();
      $('oDate').value=po.date||todayStr();
      $('oVendor').value=po.vendor||'';
      $('oExp').value=po.expectedDate||'';
      $('oNotes').value=po.notes||'';
      $('oLines').innerHTML='';
      po.lines.forEach(function(L){
        addDocLine('oLines','poItemsDL','Qty');
        var ws=document.querySelectorAll('#oLines .docline');
        var w=ws[ws.length-1];
        w.querySelector('.dItem').value=L.item||'';
        w.querySelector('.dQty').value=qn(L.qtyOrdered);
        w.querySelector('.dUom').textContent=L.uom||'';
      });
      if(!po.lines.length) addDocLine('oLines','poItemsDL','Qty');
      $('oSubmit').textContent='Save changes to '+poId;
      var bar=$('oDraftBar');
      if(bar) bar.innerHTML='<div class="msg" style="background:var(--warn-soft,#FFF4D6);'+
        'border:1px solid var(--warn,#9A6712)33;color:var(--warn,#9A6712);margin:0 0 10px">'+
        'Editing <b>'+esc(poId)+'</b>. Saving replaces its item list.'+
        (po.status==='Sent'?' This PO has already been sent \u2014 the vendor is holding the '+
          'old list, so send the updated message after saving.':'')+'</div>';
    });
  }).catch(function(e){ toast((e&&e.message)||'Failed', true); });
}
function poEndEdit(){
  _editPoId=null;
}
function submitPO(){
  var msg=$('oMsg'); msg.className='msg err'; msg.textContent='';
  var date=$('oDate').value, vendor=$('oVendor').value.trim();
  if(!date){ msg.textContent='Pick a PO date.'; return; }
  if(!vendor){ msg.textContent='Choose a vendor.'; return; }
  var got=collectDocLines('oLines');
  if(got.unknown && got.unknown.length){
    var _om=$('oMsg');
    if(_om){ _om.className='msg err';
      _om.textContent='Not in Item Master: '+got.unknown.join(', ')+
        '. Pick from the list, or add it with "+ New item to master" first.'; }
    else toast('Not in Item Master: '+got.unknown.join(', '), true);
    return;
  }
  if(got.bad){ msg.textContent='Each line needs an item and a qty (or clear the line).'; return; }
  if(!got.rows.length){ msg.textContent='Add at least one item.'; return; }
  var editing=_editPoId;
  var payload={date:date, vendor:vendor, expectedDate:$('oExp').value,
               notes:$('oNotes').value.trim(), rows:got.rows};
  if(editing) payload.poId=editing;

  /* Clear first, save in the background. The queue already holds the payload, so
     there is nothing to lose by letting the user carry straight on. */
  var label=(editing?('changes to '+editing)
                    :(vendor+' \u00b7 '+got.rows.length+' item'+(got.rows.length===1?'':'s')));
  var chip=optChip('oStatus', label);
  draftClear('po');
  poEndEdit();
  buildPOForm();

  api(editing?'updatePO':'createPO', payload).then(function(res){
    if(!res.ok){
      optFail(chip, (editing?'Update':'PO')+' not saved: '+(res.error||'failed'));
      toast(res.error||'Not saved', true);
      return;
    }
    optDone(chip, res.poId+(editing?' updated':' created')+' \u00b7 '+res.lines+' item(s)');
    toast(res.poId+(editing?' updated':' created'));
    if(activeTab==='orders' && oMode==='list') loadPOList();
    /* An amended PO that has already gone out leaves the vendor holding a stale
       list. Opening the updated message straight away makes re-sending a single
       tap instead of something to remember later. */
    if(res.wasSent){
      setTimeout(function(){
        api('getPOText',{poId:res.poId}).then(function(t){
          if(!t.ok) return;
          var card=document.querySelector('[data-po="'+res.poId+'"]');
          if(!card) return;
          var out=card.querySelector('.po-out');
          out.innerHTML='<div class="msg" style="background:var(--warn-soft,#FFF4D6);'+
              'border:1px solid var(--warn,#9A6712)33;color:var(--warn,#9A6712);margin:8px 0 0">'+
              'Updated order \u2014 resend this to '+esc(t.vendor||'the vendor')+'.</div>'+
            '<textarea readonly style="width:100%;min-height:150px;margin-top:8px;'+
              'font:12px/1.45 var(--mono,monospace);padding:8px;border:1px solid var(--line);'+
              'border-radius:8px">'+esc(t.text)+'</textarea>'+
            '<div class="actions" style="gap:6px"><a class="btn small" style="text-decoration:none" '+
              'target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(t.text)+
              '">Resend on WhatsApp</a></div>';
          card.scrollIntoView({block:'nearest', behavior:'smooth'});
        }).catch(function(){});
      }, 400);
    }
  }).catch(function(e){
    optFail(chip, 'Not saved: '+((e&&e.message)||'connection failed'));
    toast((e&&e.message)||'Connection failed', true);
  });
}

      ((p.status==='Draft'&&cap('Action: Send PO'))?'<button class="btn small po-send">Mark sent</button>':'')+
      ((p.status!=='Received'&&p.status!=='Cancelled'&&cap('Entry: Purchase Order'))?'<button class="btn secondary small po-cancel">Cancel</button>':'')+
    '</div><div class="po-out"></div></div>';
}
function wirePOCard(p){
  var card=document.querySelector('[data-po="'+p.poId+'"]');
  if(!card) return;
  var out=card.querySelector('.po-out');
  var bT=card.querySelector('.po-text'), bS=card.querySelector('.po-send'),
      bC=card.querySelector('.po-cancel'), bE=card.querySelector('.po-edit');
  var tog=card.querySelector('.po-toggle'), lines=card.querySelector('.po-lines');
  if(tog) tog.onclick=function(){
    var open=lines.style.display!=='none';
    lines.style.display=open?'none':'';
    tog.textContent=open?'show items':'hide items';
  };
  if(bE) bE.onclick=function(){ poBeginEdit(p.poId); };
  function showText(t){
    /* A plain textarea plus a wa.me link: clipboard APIs are unreliable inside
       the HtmlService sandbox, and a WhatsApp deep link skips copying entirely. */
    out.innerHTML='<textarea readonly style="width:100%;min-height:150px;margin-top:8px;'+
      'font:12px/1.45 var(--mono,monospace);padding:8px;border:1px solid var(--line);border-radius:8px">'+
      esc(t)+'</textarea>'+
      '<div class="actions" style="gap:6px"><a class="btn small" style="text-decoration:none" target="_blank" rel="noopener" '+
      'href="https://wa.me/?text='+encodeURIComponent(t)+'">Open in WhatsApp</a>'+
      '<button class="btn secondary small po-sel">Select all</button></div>';
    out.querySelector('.po-sel').onclick=function(){ var ta=out.querySelector('textarea'); ta.focus(); ta.select(); };
  }
  if(bT) bT.onclick=function(){
    bT.disabled=true;
    api('getPOText',{poId:p.poId}).then(function(r){
      bT.disabled=false;
      if(!r.ok){ out.innerHTML='<div class="msg err">'+esc(r.error||'Failed')+'</div>'; return; }
      showText(r.text);
    }).catch(function(){ bT.disabled=false; });
  };
  if(bS) bS.onclick=function(){
    bS.disabled=true; bS.textContent='Sending\u2026';
    api('sendPO',{poId:p.poId}).then(function(r){
      if(!r.ok){ bS.disabled=false; bS.textContent='Mark sent'; toast(r.error||'Failed', true); return; }
      toast(p.poId+' marked sent'); if(r.text) showText(r.text); fetchPOs();
    }).catch(function(){ bS.disabled=false; bS.textContent='Mark sent'; });
  };
  if(bC) bC.onclick=function(){
    armConfirm(bC, 'Cancel '+p.poId+'?', function(){
      api('cancelPO',{poId:p.poId}).then(function(r){
        if(!r.ok){ toast(r.error||'Failed', true); return; }
        toast(p.poId+' cancelled'); fetchPOs();
      }).catch(function(){ toast('Could not reach the server', true); });
    });
  };
}

function wireReceiveCard(p){
  var card=document.querySelector('[data-rc="'+p.poId+'"]');
  if(!card) return;
  var body=card.querySelector('.rc-body');
  var bOpen=card.querySelector('.rc-open'), bClose=card.querySelector('.rc-close');
  if(bOpen) bOpen.onclick=function(){
    body.style.display='';
    bOpen.style.display='none';
    /* Only reveal after expanding, or the card scrolls before it has height. */
    setTimeout(function(){
      try{ body.scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){}
    }, 60);
  };
  if(bClose) bClose.onclick=function(){
    body.style.display='none';
    bOpen.style.display='';
    try{ card.scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){}
  };
  var host=card.querySelector('.rc-lines');
  host.innerHTML=p.lines.map(function(L,i){
    return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
      '<span style="flex:2.4;min-width:0;font-size:13px">'+esc(L.item)+'</span>'+
      '<span style="flex:.9;min-width:0;font-size:12px;color:var(--muted)">ord '+qn(L.qtyOrdered)+' '+esc(L.uom||'')+'</span>'+
      '<input class="rcQty" data-item="'+esc(L.item)+'" type="text" inputmode="decimal" '+
        'value="'+qn(L.qtyOrdered)+'" style="flex:1;min-width:0">'+
      '<input class="rcRem" placeholder="Remark" style="flex:1.4;min-width:0">'+
      '</div>';
  }).join('');
  card.querySelector('.rc-save').onclick=function(){
    var msg=card.querySelector('.rc-msg'); msg.className='msg err'; msg.textContent='';
    var rows=[], bad=false;
    Array.prototype.forEach.call(card.querySelectorAll('.rcQty'), function(inp, i){
      var q=inp.value.trim();
      if(q===''){ bad=true; return; }
      var rem=card.querySelectorAll('.rcRem')[i];
      rows.push([inp.getAttribute('data-item'), q, rem?rem.value.trim():'']);
    });
    if(bad){ msg.textContent='Every line needs a received qty (enter 0 if nothing came).'; return; }
    var b=card.querySelector('.rc-save');
    armConfirm(b, 'This closes '+p.poId+'. Receive these quantities?', function(){
      b.disabled=true; b.textContent='Saving\u2026';
      api('receivePO',{poId:p.poId, date:todayStr(), rows:rows}).then(function(r){
        b.disabled=false; b.textContent='Confirm receipt';
        if(!r.ok){ msg.className='msg err'; msg.textContent=r.error||'Failed'; return; }
        toast(r.grnId+' created \u00b7 received '+qn(r.totalReceived)+
              (r.totalShort?(' \u00b7 short '+qn(r.totalShort)):''));
        rcMode='convert'; paintRcTabs(); rcShow();
      }).catch(function(e){
        b.disabled=false; b.textContent='Confirm receipt';
        msg.className='msg err'; msg.textContent=(e&&e.message)||'Connection failed';
      });
    });
  };
}
function loadGRNs(){
  $('rcBody').innerHTML='<div class="sub" style="margin:0 0 8px">Received goods still waiting for a purchase entry. '+
      'Opening one pre-fills the Purchase form \u2014 add the rate and the bill number there.</div>'+
    '<div class="actions"><button class="btn secondary small" id="gRef">Refresh</button></div>'+
    '<div id="gList"><div class="stub">Loading\u2026</div></div>';
  $('gRef').onclick=loadGRNs;
  api('listGRNs',{status:'Received'}).then(function(res){

    /* Header only, same as the Receiving list: you choose the GRN first, and a
       full item list per card made the page impossible to scan on a phone. */
    $('gList').innerHTML=res.grns.map(function(g){
      var short=g.lines.filter(function(L){ return L.shortBy>0; }).length;
      var extra=g.lines.filter(function(L){ return L.shortBy<0; }).length;
      return '<div class="card" style="margin:8px 0;padding:12px" data-grn="'+esc(g.grnId)+'">'+
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px">'+
          '<b>'+esc(g.grnId)+'</b>'+statusPill(g.status)+'</div>'+
        '<div style="font-size:13px;margin-bottom:2px"><b>'+esc(g.vendor)+'</b></div>'+
        '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">'+
          'Received '+esc(g.date)+' \u00b7 from '+esc(g.poId)+
          ' \u00b7 '+g.lines.length+' item'+(g.lines.length===1?'':'s')+
          (short?(' \u00b7 <span style="color:var(--danger)">'+short+' short</span>'):'')+
          (extra?(' \u00b7 <span style="color:var(--warn)">'+extra+' extra</span>'):'')+
          ' \u00b7 <span class="grn-toggle" style="color:var(--accent,#0F5C4A);cursor:pointer;'+
          'text-decoration:underline">show items</span></div>'+
        '<div class="grn-lines" style="display:none;font-size:13px;margin-bottom:8px">'+
          g.lines.map(function(L){
            var sh=(L.shortBy>0)?(' <span style="color:var(--danger)">short '+qn(L.shortBy)+'</span>'):
                   (L.shortBy<0?(' <span style="color:var(--warn)">extra '+qn(-L.shortBy)+'</span>'):'');
            return esc(L.item)+' \u2014 '+qn(L.qtyReceived)+' '+esc(L.uom||'')+sh;
          }).join('<br>')+'</div>'+
        '<div class="actions" style="gap:6px;flex-wrap:wrap">'+
          '<button class="btn small grn-go">Make purchase entry</button>'+
          '<button class="btn secondary small grn-done">Already purchased</button>'+

    }).join('');
    res.grns.forEach(function(g){
      var card=document.querySelector('[data-grn="'+g.grnId+'"]');
      if(!card) return;
      var tog=card.querySelector('.grn-toggle'), lines=card.querySelector('.grn-lines');
      if(tog) tog.onclick=function(){
        var open=lines.style.display!=='none';
        lines.style.display=open?'none':'';
        tog.textContent=open?'show items':'hide items';
      };
      card.querySelector('.grn-go').onclick=function(){ grnToPurchase(g.grnId); };
      /* Escape hatch. A GRN only clears itself when the purchase is entered via
         the button above, which is what passes the GRN id through to the save.
         Enter that purchase straight from the Purchases tab instead and nothing
         links back, so the GRN would sit here for ever. This closes it by hand,
         and records a blank PR_ID rather than inventing one. */
      var bd=card.querySelector('.grn-done');
      if(bd) bd.onclick=function(){
        armConfirm(bd, 'Close '+g.grnId+' without linking a purchase? Use this only if the '+
                       'purchase was already entered separately.', function(){
          bd.disabled=true;
          api('markGRNConverted',{grnId:g.grnId, prId:''}).then(function(r){
            bd.disabled=false;
            if(!r || !r.ok){
              var m=card.querySelector('.grn-msg');
              m.className='msg err'; m.textContent=(r&&r.error)||'Could not update';
              return;
            }
            toast(g.grnId+' closed');
            loadGRNs();
          }).catch(function(e){
            bd.disabled=false;
            var m=card.querySelector('.grn-msg');
            m.className='msg err'; m.textContent=(e&&e.message)||'Connection failed';
          });
        });
      };
    });
  }).catch(function(e){ $('gList').innerHTML='<div class="msg err">'+esc((e&&e.message)||'Failed')+'</div>'; });
}
function grnToPurchase(grnId){
  api('getGRNForPurchase',{grnId:grnId}).then(function(r){
    if(!r.ok){ toast(r.error||'Failed', true); return; }
    /* Purchase prefill rows are [date, item, qty, rate, vendor, bill, notes].
       Rate is intentionally blank: it is captured here and nowhere else. */
    var rows=r.rows.map(function(L){
      return [r.date, L[0], L[1], '', r.vendor, '', 'From '+grnId+' / '+r.poId];
    });
    if(!cap('Entry: Purchase')){
      toast('You do not have Purchase entry rights \u2014 ask someone with them to convert '+grnId, true);
      return;
    }
    if(state.me.venue==='ALL'){
      toast('Pick a single venue in the bar above before converting '+grnId, true);
      return;
    }
    _pendingPrefill={type:'purchase', rows:rows};
    _convertGrnId=grnId;
    pKind='variable'; pMode='form'; activeTab='purchases'; renderTabs();
    toast('Enter rates and the bill number, then submit');
  }).catch(function(e){ toast((e&&e.message)||'Failed', true); });
}

}
function rqShow(){

function buildReqForm(){

    '<datalist id="rqItemsDL"></datalist><datalist id="rqDeptDL">'+deptOpts+'</datalist>'+

    '<div id="qLines"></div>'+
    '<div class="actions"><button class="btn secondary small" id="qAdd">+ Add item</button>'+

    '</div>'+

  $('qAdd').onclick=function(){ addDocLine('qLines','rqItemsDL','Required'); };
